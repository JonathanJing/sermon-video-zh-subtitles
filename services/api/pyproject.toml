[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tongxing-api"
version = "0.1.0"
description = "HTTP API service implementation for sermon captions"
requires-python = ">=3.12"
dependencies = ["google-auth[requests]>=2.35,<3"]

[tool.setuptools.packages.find]
where = ["src"]
