<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>同行 Dev</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
    main { width: min(38rem, calc(100% - 3rem)); line-height: 1.65; }
    .badge { display: inline-block; padding: .3rem .7rem; border-radius: 999px; background: #b45309; color: white; font-weight: 700; }
    code { font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <main>
    <p class="badge">Development environment</p>
    <h1>同行多语言开发环境</h1>
    <p>这是独立的 Firebase Dev project，不是生产发布页。目前尚未发布通过门禁的 <code>weekly.json</code>、<code>multilingual.json</code> 或目标语言 Release Package。</p>
    <p>只有通过 Layer 2 人工翻译审核、Layer 3 对应语言音频状态检查和 Layer 4 HTTP 验证的资产，才会进入此环境的可选择语言列表。</p>
  </main>
</body>
</html>
