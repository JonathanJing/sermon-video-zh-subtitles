name: Python tests

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify and validate documentation changes
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CHANGE_EVENT: ${{ github.event_name }}
        run: >-
          python3 scripts/docs_change_gate.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --event "$CHANGE_EVENT"
          --output "$GITHUB_OUTPUT"

  test_group:
    name: test-group (root-${{ matrix.shard_index }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install audio verification tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Compile production scripts
        if: matrix.shard_index == 1
        run: >-
          python -m py_compile
          scripts/build_sermon_reading_edition_with_openai.py
          scripts/generate_notes_with_openai.py
          scripts/post_live_run_status.py
          scripts/render_sermon_interpretation_pdf.py
          scripts/review_prompts.py
          scripts/run_codex_local_sermon_production.py
          scripts/run_post_live_subtitle_generation.py
          scripts/run_sermon_production_supervisor_agent.py
          scripts/sermon_production_supervisor.py

      - name: Run unit tests
        run: >-
          python scripts/run_unittest_ci.py
          --weights .github/unittest-module-timings.json
          --shard-count 2
          --shard-index ${{ matrix.shard_index }}
          --report "${RUNNER_TEMP}/unittest-root-${{ matrix.shard_index }}.json"

      - name: Preserve unit test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-timings-root-${{ matrix.shard_index }}
          path: ${{ runner.temp }}/unittest-root-${{ matrix.shard_index }}.json
          if-no-files-found: warn

      - name: Run dubbing workflow and review contract tests
        if: matrix.shard_index == 1
        run: python -m unittest discover -s experiments/sermon-dubbing-poc -p "test_*.py"

      - name: Check listening app behavior
        if: matrix.shard_index == 1
        run: node --test experiments/sermon-dubbing-poc/web/*.test.mjs

      - name: Check feedback API contracts
        if: matrix.shard_index == 1
        run: node --test experiments/sermon-dubbing-poc/feedback-api/test/*.test.mjs experiments/sermon-dubbing-poc/feedback-api/usage-report.test.mjs

  # Keep this job name stable: branch protection requires the unittest check.
  unittest:
    needs: [changes, test_group]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require docs validation or every test group
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          TEST_GROUP_RESULT: ${{ needs.test_group.result }}
        run: |
          set -euo pipefail
          test "$CHANGE_RESULT" = success
          if test "$DOCS_ONLY" = true; then
            test "$TEST_GROUP_RESULT" = skipped
          else
            test "$DOCS_ONLY" = false
            test "$TEST_GROUP_RESULT" = success
          fi
