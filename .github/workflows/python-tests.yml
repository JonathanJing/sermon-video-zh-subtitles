name: Python tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile production scripts
        run: >-
          python -m py_compile
          scripts/build_sermon_reading_edition_with_openai.py
          scripts/generate_notes_with_openai.py
          scripts/post_live_run_status.py
          scripts/render_sermon_interpretation_pdf.py
          scripts/review_prompts.py
          scripts/run_codex_local_sermon_production.py
          scripts/run_post_live_subtitle_generation.py
          scripts/run_sermon_production_supervisor_agent.py
          scripts/sermon_production_supervisor.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
