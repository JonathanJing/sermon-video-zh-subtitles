name: Local Prefect pilot
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'scripts/sermon*'
      - 'scripts/canonical_pipeline_definition.py'
      - 'scripts/run_sermon_prefect_dag.py'
      - 'tests/test_sermon_prefect*'
      - 'requirements-prefect.txt'
      - '.github/workflows/prefect-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prefect-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-prefect.txt
      - name: Validate durable adapter and real local Prefect engine
        env:
          SERMON_TEST_PREFECT: '1'
        run: python -m unittest tests.test_sermon_prefect_dag tests.test_sermon_prefect_runtime -v
