name: Backend image resources

on:
  pull_request:
    branches: [dev, main]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - services/api/**
      - backend/cloud_run_jobs.py
      - schemas/**
      - docs/series-terminology.zh.md
      - .github/workflows/backend-image-resources.yml
  workflow_dispatch:

jobs:
  resource-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --tag sermon-backend-resource-smoke .
      - name: Read installed schema through production loader
        run: |
          docker run --rm --entrypoint python sermon-backend-resource-smoke -c '
          from scripts import tongxing_host
          from tongxing_production.contracts import schemas
          schemas.validator("sermon-app-delivery-v1")
          '
      - name: Read installed terminology catalog through production loader
        run: |
          docker run --rm --entrypoint python sermon-backend-resource-smoke -c '
          from scripts import series_terminology
          catalog = series_terminology.context()
          assert catalog["entries"]
          '
      - name: Import API dispatcher through both service and legacy paths
        run: |
          docker run --rm --entrypoint python sermon-backend-resource-smoke -c '
          import backend.cloud_run_jobs as legacy
          from tongxing_api import cloud_run_jobs as service
          from backend.app import dispatch_cloud_run_job
          assert legacy is service
          assert dispatch_cloud_run_job is service.dispatch_cloud_run_job
          '
