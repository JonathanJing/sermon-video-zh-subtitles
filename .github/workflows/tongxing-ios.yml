name: Tongxing iOS

on:
  pull_request:
    branches:
      - dev
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: tongxing-ios-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Keep the workflow unconditional: a path-filtered required check stays pending.
  changes:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.detect.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect native and shared-contract changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              scope = "native"
          else:
              base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
              if not base or not head:
                  raise SystemExit("Pull request SHAs are missing")
              paths = [p.decode("utf-8") for p in subprocess.check_output(
                  ["git", "diff", "--no-renames", "--name-only", "-z", f"{base}...{head}"]
              ).split(b"\0") if p]
              # Cover current and future catalog/Release versions. Rename
              # detection is disabled so removing a contract still routes here.
              shared_schema_prefixes = (
                  "schemas/sermon-multilingual-catalog-",
                  "schemas/sermon-target-language-release-package-",
                  "schemas/sermon-weekly-catalog-",
              )
              shared_contracts = {
                  "scripts/build_multilingual_catalog.py",
                  "scripts/stage_formal_multilingual_dev.py",
                  "scripts/build_formal_dev_release_assets.py",
                  "scripts/build_full_video_app_release.py",
                  "scripts/assemble_multilingual_hosting.py",
                  "scripts/assemble_multilingual_v3_update.py",
                  "scripts/bind_published_alignment_catalog.py",
                  "scripts/refresh_multilingual_hosting_with_legacy.py",
                  "scripts/seal_multilingual_dev_catalog.py",
                  "experiments/sermon-dubbing-poc/web/catalog.mjs",
                  "experiments/sermon-dubbing-poc/web/published-weeks.mjs",
                  "firebase/dev/public/formal-dev-adapter.mjs",
              }
              if any(p.startswith("apps/tongxing-ios/") or
                     p == ".github/workflows/tongxing-ios.yml" for p in paths):
                  scope = "native"
              elif any(p in shared_contracts or p.startswith(shared_schema_prefixes) for p in paths):
                  scope = "contract"
              else:
                  scope = "none"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"scope={scope}\n")
          print("Native validation scope:", scope)
          PY

  contract-validation:
    needs: changes
    if: (needs.changes.outputs.scope == 'contract' || (needs.changes.outputs.scope == 'native' && github.base_ref == 'dev')) && !github.event.pull_request.draft
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/tongxing-ios
    steps:
      - uses: actions/checkout@v4
      - name: Check native catalog decoding and storage contracts
        run: |
          swift test --package-path Core
          swift test

  ios-validation:
    needs: changes
    if: needs.changes.outputs.scope == 'native' && (github.event_name == 'workflow_dispatch' || (github.base_ref == 'main' && !github.event.pull_request.draft))
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/tongxing-ios
    steps:
      - uses: actions/checkout@v4
      - name: Show Apple toolchain
        run: xcodebuild -version
      - name: Core behavior tests
        run: swift test --package-path Core
      - name: Storage and shared source checks
        run: swift test
      - name: Build for iOS Simulator without signing
        run: >-
          ./scripts/ios.sh build --developer-dir "$(xcode-select -p)"
          --derived-data DerivedData --artifacts-dir TestResults
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          inventory = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "--json"]))
          runtimes = sorted(
              (r for r in inventory["runtimes"] if r["isAvailable"] and r["name"].startswith("iOS ")
               and int(r["version"].split(".")[0]) >= 17),
              key=lambda r: tuple(map(int, r["version"].split("."))), reverse=True,
          )
          candidates = [d for r in runtimes for d in inventory["devices"].get(r["identifier"], [])
                        if d["isAvailable"] and d["name"].startswith("iPhone")]
          if not candidates:
              raise SystemExit("An available iOS 17+ iPhone simulator is required for hosted tests.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"udid={candidates[0]['udid']}\n")
          print("Hosted tests:", candidates[0]["name"], candidates[0]["udid"])
          PY
      - name: iOS player and user-flow tests
        run: >-
          ./scripts/ios.sh test --developer-dir "$(xcode-select -p)"
          --simulator '${{ steps.simulator.outputs.udid }}'
          --derived-data DerivedData --artifacts-dir TestResults
          --only-testing TongxingTests --only-testing TongxingUITests
      - name: Preserve iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tongxing-ios-tests
          path: apps/tongxing-ios/TestResults/
          if-no-files-found: ignore

  # Branch protection requires this stable status on every PR.
  native-client:
    needs: [changes, contract-validation, ios-validation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required iOS result
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          BASE_BRANCH: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          CONTRACT_RESULT: ${{ needs.contract-validation.result }}
          IOS_RESULT: ${{ needs.ios-validation.result }}
        run: |
          set -euo pipefail
          test "$CHANGE_RESULT" = success
          case "$SCOPE" in none|contract|native) ;; *) exit 1 ;; esac
          if test "$EVENT_NAME" != workflow_dispatch && test "$IS_DRAFT" = true; then
            test "$CONTRACT_RESULT" = skipped
            test "$IOS_RESULT" = skipped
          elif test "$SCOPE" = native && { test "$BASE_BRANCH" = main || test "$EVENT_NAME" = workflow_dispatch; }; then
            test "$IOS_RESULT" = success
            test "$CONTRACT_RESULT" = skipped
          elif test "$SCOPE" = contract || { test "$SCOPE" = native && test "$BASE_BRANCH" = dev; }; then
            test "$CONTRACT_RESULT" = success
            test "$IOS_RESULT" = skipped
          else
            test "$SCOPE" = none
            test "$CONTRACT_RESULT" = skipped
            test "$IOS_RESULT" = skipped
          fi
