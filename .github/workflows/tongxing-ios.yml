name: Tongxing iOS

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

concurrency:
  group: tongxing-ios-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Keep the workflow unconditional: a path-filtered required check stays pending.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.detect.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect iOS changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              ios_changed = True
          else:
              base = os.environ["BASE_SHA"]
              head = os.environ["HEAD_SHA"]
              if not base or not head:
                  raise SystemExit("Pull request SHAs are missing")
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", "-z", base, head]
              ).split(b"\0")
              ios_changed = any(
                  path.startswith(b"apps/tongxing-ios/")
                  or path == b".github/workflows/tongxing-ios.yml"
                  for path in changed if path
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ios={str(ios_changed).lower()}\n")
          print("Run iOS validation:", ios_changed)
          PY

  ios-validation:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/tongxing-ios
    steps:
      - uses: actions/checkout@v4
      - name: Show Apple toolchain
        run: xcodebuild -version
      - name: Core behavior tests
        run: swift test --package-path Core
      - name: Storage and shared source checks
        run: swift test
      - name: Build for iOS Simulator without signing
        run: >-
          ./scripts/ios.sh build --developer-dir "$(xcode-select -p)"
          --derived-data DerivedData --artifacts-dir TestResults
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          inventory = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "--json"]))
          runtimes = sorted(
              (r for r in inventory["runtimes"] if r["isAvailable"] and r["name"].startswith("iOS ")
               and int(r["version"].split(".")[0]) >= 17),
              key=lambda r: tuple(map(int, r["version"].split("."))), reverse=True,
          )
          candidates = [d for r in runtimes for d in inventory["devices"].get(r["identifier"], [])
                        if d["isAvailable"] and d["name"].startswith("iPhone")]
          if not candidates:
              raise SystemExit("An available iOS 17+ iPhone simulator is required for hosted tests.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"udid={candidates[0]['udid']}\n")
          print("Hosted tests:", candidates[0]["name"], candidates[0]["udid"])
          PY
      - name: iOS player and user-flow tests
        run: >-
          ./scripts/ios.sh test --developer-dir "$(xcode-select -p)"
          --simulator '${{ steps.simulator.outputs.udid }}'
          --derived-data DerivedData --artifacts-dir TestResults
          --only-testing TongxingTests --only-testing TongxingUITests
      - name: Preserve iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tongxing-ios-tests
          path: apps/tongxing-ios/TestResults/
          if-no-files-found: ignore

  # Branch protection requires this stable status on every PR.
  native-client:
    needs: [changes, ios-validation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required iOS result
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          IOS_CHANGED: ${{ needs.changes.outputs.ios }}
          IOS_RESULT: ${{ needs.ios-validation.result }}
        run: |
          set -euo pipefail
          test "$CHANGE_RESULT" = success
          if test "$IOS_CHANGED" = true; then
            test "$IOS_RESULT" = success
          else
            test "$IOS_CHANGED" = false
            test "$IOS_RESULT" = skipped
          fi
