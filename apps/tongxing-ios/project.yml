name: Tongxing
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  TongxingCore:
    path: Core
  TongxingInfrastructure:
    path: .
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Tongxing:
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathanjing.tongxing.dev
        PRODUCT_NAME: Tongxing
        INFOPLIST_FILE: App/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "24"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          TONGXING_CONTENT_ORIGIN: "https://ai-for-god-sermon-audio-dev.web.app"
        Release:
          TONGXING_CONTENT_ORIGIN: "https://ai-for-god-sermon-audio.web.app"
    dependencies:
      - package: TongxingCore
      - package: TongxingInfrastructure
        product: TongxingInfrastructure
      - target: ListeningActivityExtension
        embed: true
  ListeningActivityExtension:
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    type: app-extension
    platform: iOS
    sources:
      - path: ListeningActivityExtension
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathanjing.tongxing.dev.listening-activity
        PRODUCT_NAME: ListeningActivityExtension
        INFOPLIST_FILE: ListeningActivityExtension/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "24"
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  TongxingTests:
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathanjing.tongxing.dev.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Tongxing
      - package: TongxingCore
  TongxingUITests:
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathanjing.tongxing.dev.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Tongxing
schemes:
  Tongxing:
    build:
      targets:
        Tongxing: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      environmentVariables:
        TONGXING_TEST_HOST: "1"
      targets:
        - name: TongxingTests
          parallelizable: false
          randomExecutionOrder: false
        - name: TongxingUITests
          parallelizable: false
          randomExecutionOrder: false
    archive:
      config: Release
