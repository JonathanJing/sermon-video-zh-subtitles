name: Tongxing
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  TongxingCore:
    path: Core
  TongxingInfrastructure:
    path: .
configs:
  Debug: debug
  Release: release
  BetaDebug: debug
  BetaRelease: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Tongxing:
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
      BetaDebug: Config/Signing.xcconfig
      BetaRelease: Config/Signing.xcconfig
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
      - path: Shared
    postCompileScripts:
      - name: Copy local weekly guides
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(SRCROOT)/GuideResources"
          - "$(TONGXING_GUIDE_DATA_INPUT)"
          - "$(TONGXING_GUIDE_CHECKSUM_INPUT)"
          - "$(TONGXING_GUIDE_STATUE_INPUT)"
          - "$(TONGXING_GUIDE_SON_INPUT)"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/weekly-guides.json"
        script: |
          set -eu
          destination="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/weekly-guides.json"
          rm -f "$destination"
          rm -f "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/weekly-guide-statue.jpg" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/weekly-guide-son-of-man.jpg"
          case "${CONFIGURATION}" in
            Release|BetaDebug|BetaRelease)
              source="${SRCROOT}/GuideResources/weekly-guides.json"
              checksum="${SRCROOT}/GuideResources/weekly-guides.sha256"
              if [ "${CONFIGURATION}" = "Release" ] && { [ ! -f "$source" ] || [ ! -f "$checksum" ]; }; then
                echo "error: Release requires the verified weekly guide payload and SHA-256"
                exit 1
              fi
              if [ -f "$source" ] || [ -f "$checksum" ]; then
                if [ ! -f "$source" ] || [ ! -f "$checksum" ]; then
                  echo "error: local guide payload and SHA-256 must both exist"
                  exit 1
                fi
                expected=$(/bin/cat "$checksum")
                actual=$(/usr/bin/shasum -a 256 "$source" | /usr/bin/awk '{print $1}')
                if [ "$actual" != "$expected" ]; then
                  echo "error: local guide payload checksum mismatch"
                  exit 1
                fi
                if [ "$actual" != "a527e23fbd693177b9589fc89cd3533b653f64918abb97213cf34172c36711f9" ]; then
                  echo "error: local guide payload is not the revision accepted by this App"
                  exit 1
                fi
                /bin/mkdir -p "$(/usr/bin/dirname "$destination")"
                /bin/cp "$source" "$destination"
                for asset in weekly-guide-statue.jpg weekly-guide-son-of-man.jpg; do
                  if /usr/bin/grep -Fq "$asset" "$source"; then
                    case "$asset" in
                      weekly-guide-statue.jpg) asset_sha=f1d2f517120099a38614c7c560c1fbe054ec3ea4d741284fbcef496a7dab73b5 ;;
                      weekly-guide-son-of-man.jpg) asset_sha=30c3e5b82c024bad3e40122f330f6606d022c91d8c77a82f06d6f1d5fc987f1f ;;
                    esac
                    asset_source="${SRCROOT}/GuideResources/${asset}"
                    if [ ! -f "$asset_source" ] || [ "$(/usr/bin/shasum -a 256 "$asset_source" | /usr/bin/awk '{print $1}')" != "$asset_sha" ]; then
                      echo "error: referenced weekly guide image missing or checksum mismatch: $asset"
                      exit 1
                    fi
                    /bin/cp "$asset_source" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/${asset}"
                  fi
                done
              fi
              ;;
          esac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathanjing.tongxing.dev
        PRODUCT_NAME: Tongxing
        TONGXING_DISPLAY_NAME: 同行
        TONGXING_URL_SCHEME: tongxing
        INFOPLIST_FILE: App/Info.plist
        # Non-Release builds keep the guide optional. Release declares both
        # exact files as inputs, allowing the Xcode script sandbox to stay on.
        TONGXING_GUIDE_DATA_INPUT: "$(SRCROOT)/GuideResources"
        TONGXING_GUIDE_CHECKSUM_INPUT: "$(SRCROOT)/GuideResources"
        TONGXING_GUIDE_STATUE_INPUT: "$(SRCROOT)/GuideResources"
        TONGXING_GUIDE_SON_INPUT: "$(SRCROOT)/GuideResources"
        MARKETING_VERSION: "1.26.18"
        CURRENT_PROJECT_VERSION: "58"
        # ActivityStyle.transient is absent on iOS 17 despite the current SDK's
        # enum availability. Its guarded use must not prevent app launch there.
        OTHER_LDFLAGS: "$(inherited) -weak_framework ActivityKit"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Config/AssociatedDomainsDev.entitlements
          TONGXING_CONTENT_ORIGIN: "https://ai-for-god-sermon-audio-dev.web.app"
        Release:
          CODE_SIGN_ENTITLEMENTS: Config/ProductionPush.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TONGXING_GUIDE_PREVIEW"
          TONGXING_GUIDE_DATA_INPUT: "$(SRCROOT)/GuideResources/weekly-guides.json"
          TONGXING_GUIDE_CHECKSUM_INPUT: "$(SRCROOT)/GuideResources/weekly-guides.sha256"
          TONGXING_GUIDE_STATUE_INPUT: "$(SRCROOT)/GuideResources/weekly-guide-statue.jpg"
          TONGXING_GUIDE_SON_INPUT: "$(SRCROOT)/GuideResources/weekly-guide-son-of-man.jpg"
          MARKETING_VERSION: "1.26.27"
          CURRENT_PROJECT_VERSION: "70"
          TONGXING_CONTENT_ORIGIN: "https://ai-for-god-sermon-audio.web.app"
        BetaDebug:
          CODE_SIGN_ENTITLEMENTS: Config/BetaPush.entitlements
          # The optional, ignored guide payload cannot be declared as a required
          # Xcode script input: a clean checkout intentionally has no payload.
          # Xcode's sandbox does not grant child-file reads from a directory input.
          ENABLE_USER_SCRIPT_SANDBOXING: NO
          TONGXING_APNS_ENVIRONMENT: development
          PRODUCT_BUNDLE_IDENTIFIER: com.jonathanjing.tongxing.beta
          TONGXING_DISPLAY_NAME: 同行-beta
          TONGXING_URL_SCHEME: tongxing-beta
          MARKETING_VERSION: "1.26.25"
          CURRENT_PROJECT_VERSION: "67"
          TONGXING_CONTENT_ORIGIN: "https://ai-for-god-sermon-audio-dev.web.app"
        BetaRelease:
          CODE_SIGN_ENTITLEMENTS: Config/BetaPush.entitlements
          ENABLE_USER_SCRIPT_SANDBOXING: NO
          TONGXING_APNS_ENVIRONMENT: production
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TONGXING_APNS_PRODUCTION TONGXING_GUIDE_PREVIEW"
          PRODUCT_BUNDLE_IDENTIFIER: com.jonathanjing.tongxing.beta
          TONGXING_DISPLAY_NAME: 同行-beta
          TONGXING_URL_SCHEME: tongxing-beta
          MARKETING_VERSION: "1.26.32"
          CURRENT_PROJECT_VERSION: "75"
          TONGXING_CONTENT_ORIGIN: "https://ai-for-god-sermon-audio-dev.web.app"
    dependencies:
      - package: TongxingCore
      - package: TongxingInfrastructure
        product: TongxingInfrastructure
      - target: ListeningActivityExtension
        embed: true
  ListeningActivityExtension:
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
      BetaDebug: Config/Signing.xcconfig
      BetaRelease: Config/Signing.xcconfig
    type: app-extension
    platform: iOS
    sources:
      - path: ListeningActivityExtension
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathanjing.tongxing.dev.listening-activity
        PRODUCT_NAME: ListeningActivityExtension
        TONGXING_ACTIVITY_DISPLAY_NAME: 同行播放状态
        TONGXING_URL_SCHEME: tongxing
        INFOPLIST_FILE: ListeningActivityExtension/Info.plist
        MARKETING_VERSION: "1.26.18"
        CURRENT_PROJECT_VERSION: "58"
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Release:
          MARKETING_VERSION: "1.26.27"
          CURRENT_PROJECT_VERSION: "70"
        BetaDebug:
          PRODUCT_BUNDLE_IDENTIFIER: com.jonathanjing.tongxing.beta.listening-activity
          TONGXING_ACTIVITY_DISPLAY_NAME: 同行-beta播放状态
          TONGXING_URL_SCHEME: tongxing-beta
          MARKETING_VERSION: "1.26.25"
          CURRENT_PROJECT_VERSION: "67"
        BetaRelease:
          PRODUCT_BUNDLE_IDENTIFIER: com.jonathanjing.tongxing.beta.listening-activity
          TONGXING_ACTIVITY_DISPLAY_NAME: 同行-beta播放状态
          TONGXING_URL_SCHEME: tongxing-beta
          MARKETING_VERSION: "1.26.32"
          CURRENT_PROJECT_VERSION: "75"
    dependencies:
      - package: TongxingCore
  TongxingTests:
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
      BetaDebug: Config/Signing.xcconfig
      BetaRelease: Config/Signing.xcconfig
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathanjing.tongxing.dev.tests
        GENERATE_INFOPLIST_FILE: YES
      configs:
        BetaDebug:
          PRODUCT_BUNDLE_IDENTIFIER: com.jonathanjing.tongxing.beta.tests
        BetaRelease:
          PRODUCT_BUNDLE_IDENTIFIER: com.jonathanjing.tongxing.beta.tests
    dependencies:
      - target: Tongxing
      - package: TongxingCore
  TongxingUITests:
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
      BetaDebug: Config/Signing.xcconfig
      BetaRelease: Config/Signing.xcconfig
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathanjing.tongxing.dev.uitests
        GENERATE_INFOPLIST_FILE: YES
      configs:
        BetaDebug:
          PRODUCT_BUNDLE_IDENTIFIER: com.jonathanjing.tongxing.beta.uitests
        BetaRelease:
          PRODUCT_BUNDLE_IDENTIFIER: com.jonathanjing.tongxing.beta.uitests
    dependencies:
      - target: Tongxing
schemes:
  Tongxing:
    build:
      targets:
        Tongxing: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      environmentVariables:
        TONGXING_EXPECTED_CHANNEL: production
        TONGXING_TEST_HOST: "1"
        TONGXING_PREVIEW_REQUEST: "$(TONGXING_PREVIEW_REQUEST)"
      targets:
        - name: TongxingTests
          parallelizable: false
          randomExecutionOrder: false
        - name: TongxingUITests
          parallelizable: false
          randomExecutionOrder: false
    archive:
      config: Release
  TongxingScreenshots:
    build:
      targets:
        Tongxing: all
    test:
      config: Release
      gatherCoverageData: false
      environmentVariables:
        TONGXING_EXPECTED_CHANNEL: production
        TONGXING_TEST_HOST: "0"
      targets:
        - name: TongxingUITests
          parallelizable: false
          randomExecutionOrder: false
  TongxingBeta:
    build:
      targets:
        Tongxing: all
    run:
      config: BetaDebug
    test:
      config: BetaDebug
      gatherCoverageData: true
      environmentVariables:
        TONGXING_EXPECTED_CHANNEL: beta
        TONGXING_TEST_HOST: "1"
        TONGXING_PREVIEW_REQUEST: "$(TONGXING_PREVIEW_REQUEST)"
      targets:
        - name: TongxingTests
          parallelizable: false
          randomExecutionOrder: false
        - name: TongxingUITests
          parallelizable: false
          randomExecutionOrder: false
    archive:
      config: BetaRelease
    profile:
      config: BetaRelease
    analyze:
      config: BetaDebug
