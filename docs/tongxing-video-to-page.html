<script>
const steps=[["01", 0, "SOURCE", "来源", "Receive the sermon video", "拿到本周证道视频", "Record the week, speaker, series and original URL. Download the complete authorized media and verify its duration and hash.", "记录周次、讲员、系列与原始链接，下载完整且有权使用的媒体，核对时长与文件哈希。", "No AI · yt-dlp + FFmpeg / ffprobe", "无模型 · yt-dlp + FFmpeg / ffprobe", "Verified media + source record", "完整媒体与来源记录", "A sermon-only recording and a full service archive keep separate source identities. Existing valid artifacts can be reused.", "纯证道视频与完整礼拜归档分别保留来源身份；已核实的有效产物可以复用。", "codex-local-production-runbook.zh.md"], ["02", 0, "SOURCE WINDOW", "来源范围", "Use the provided sermon window", "使用已提供的证道范围", "For a full service archive, use the start and end times supplied and confirmed by the operator. For a sermon-only video, use the complete verified clip.", "完整礼拜归档直接采用操作员提供并确认的起止时间；纯证道视频使用经过核验的完整片段。", "No AI · operator input + FFmpeg / ffprobe", "无模型 · 人工提供范围 + FFmpeg / ffprobe", "Source-bound window + extracted sermon audio", "与来源绑定的范围记录及证道音频", "Record the original source, absolute start/end times and confirmation. Check that the range is within the media duration, then extract the audio. If the range is missing, obtain it from the operator before continuing.", "记录原始来源、绝对起止时间与确认信息，检查范围未超出媒体时长后提取音频。若尚未提供范围，先由操作员补充，再继续后续制作。", "codex-local-production-runbook.zh.md"], ["03", 0, "TRANSCRIPT", "英文", "Freeze the English reference", "建立并冻结英文参考稿", "Transcribe the approved audio into English and preserve its source evidence. Keep the original transcript for every later translation and review.", "将批准范围内的音频转写为英文，保存来源证据，作为后续翻译与审核的固定参照。", "OpenAI API · gpt-transcribe", "OpenAI API · gpt-transcribe", "English transcript + segment IDs", "英文转写与段落 ID", "Suitable existing English captions can be reused on supported intake routes. ASR text is machine transcription, not human-verified verbatim text. Freeze this text before the following MFA alignment stage.", "支持的导入路径可复用合适的现成英文字幕。ASR 是机器转写，不标为人工逐字核验稿；先冻结这份文字，再进入下一步 MFA 对齐。", "../scripts/run_post_live_subtitle_generation.py"], ["04", 0, "WORD ALIGNMENT", "词级对齐", "Align the frozen English to the audio", "将冻结英文对齐到原声", "Align the approved audio and frozen English on MacBook first. MFA locates words and phones in the recording; retain punctuation-based sentence boundaries and preserve the original text.", "优先在 MacBook 对批准音频与冻结英文执行 MFA，定位录音中的词与音素；保留原文标点决定的句界，不改写英文。", "MacBook primary → DGX Spark fallback · MFA + optional G2P", "MacBook 优先 → DGX Spark 备用 · MFA + 可选 G2P", "Model-estimated word / phone times + provenance manifest", "模型估计的词／音素时间与来源清单", "These are acoustic forced-alignment estimates, not character-length interpolation or human-verified timing. Local runtime or inference unavailability may select the configured Spark fallback; invalid text, alignment evidence or required review still stops the stage. Pause, pitch, energy and word-final lengthening remain research inputs; a sentence-ending / rhetorical-pause / breath classifier is not in production.", "时间来自声学强制对齐，仍是模型估计，并非字符插值或人工核验时间。本机运行环境或推理不可用时可切换已配置的 Spark 备用；文字错误、对齐证据不合格或待审核状态仍须停止。停顿、音高、能量与词尾延长仍属研究输入，句末／修辞停顿／换气分类器尚未生产化。", "mfa-production.zh.md"], ["05", 0, "TRANSLATION", "翻译", "Translate, review and lock Scripture", "翻译、审校与锁定和合本经文", "Create the Chinese reading text and run two editorial/review passes. Before delivery and dubbing, identify Scripture, retrieve exact CUV text, then translate and independently review the surrounding narration.", "生成中文阅读稿并进行两轮编辑／审核。交付和配音前，识别直接经文，从固定和合本库取文，再翻译并独立审校周围的叙述。", "gpt-6-astra · Medium + fixed CUV library", "gpt-6-astra · Medium + 固定和合本库", "Reviewed bilingual text + CUV locks", "经审校双语稿与经文锁定记录", "CUV processing is an explicit downstream step, not automatically invoked by the Supervisor. The program injects exact Scripture text; review checks meaning, negation, numbers, names and quotation attribution. Series names follow the shared terminology table.", "CUV 是需单独执行的后续步骤，Supervisor 尚未自动调用。程序注入精确经文；审校检查完整含义、否定、数字、专名与引文归属，并沿用共享系列术语表。", "sermon-cuv-production.zh.md"], ["06", 1, "COMPANION", "同行稿", "Create the reading and companion materials", "生成阅读稿与证道同行内容", "Generate the message summary, outline and source-backed explanations. Render the bilingual reading PDF and Chinese companion PDF, then check their content and layout.", "生成核心信息、证道大纲及有来源支持的解读，排版双语阅读 PDF 与中文证道同行 PDF，并检查内容与版面。", "gpt-6-astra · Medium + PDF tools", "gpt-6-astra · Medium + PDF 工具", "Two PDFs + structured companion content", "两份 PDF 与结构化同行内容", "The companion is an outline, not the dubbing script. Update related outputs after CUV revisions so displayed quotations and spoken quotations use the same approved text version.", "证道同行是解读大纲，不能直接作为配音稿。CUV 修订后需更新关联产物，使显示经文与口播经文采用同一份通过审校的文本。", "codex-local-production-runbook.zh.md"], ["07", 1, "VOICE SCRIPT", "口播稿", "Prepare a natural spoken script", "整理适合聆听的口播稿", "Derive spoken Chinese from the reviewed bilingual passages. Review it against the English, choose the speaker’s authorized checkpoint, and freeze the text, voice and source in a new job.", "从审校后的双语段落派生中文口播稿，对照英文复核，选择已授权的对应讲员检查点，在新任务中冻结文字、声音与来源。", "gpt-6-astra review + deterministic job builder", "gpt-6-astra 审核 + 确定性任务构建", "Frozen job.json + synthesis units", "冻结的 job.json 与合成单元", "Spoken-script review is a separately recorded step; the bridge does not automatically run an Astra editing service. Model review remains labeled as model review.", "口播审稿作为独立步骤留存记录，桥接器不会自动运行 Astra 审稿服务；模型审校仍明确标注为机器审核。", "sermon-dubbing-system-design.zh.md"], ["08", 1, "SYNTHESIS", "配音", "Generate the Chinese voice", "生成中文配音", "Use the registered speaker checkpoint to synthesize the script in small units. Prefer MacBook MPS, with DGX Spark as fallback; a short MacBook sample with the authorized checkpoint has passed real synthesis.", "使用登记的讲员检查点按小单元合成中文，优先 MacBook MPS、DGX Spark 备用。已用授权讲员检查点完成本机短样本真实合成。", "MacBook primary / DGX Spark fallback · Qwen3-TTS · 1.7B + speaker SFT", "MacBook 优先／DGX Spark 备用 · Qwen3-TTS · 1.7B + 讲员 SFT", "Unit WAVs + Chinese MP3 + measured cues", "分段 WAV、中文 MP3 与实测字幕时间", "Base model: Qwen/Qwen3-TTS-12Hz-1.7B-Base. Reuse the registered speaker checkpoint rather than retraining weekly. A 10-character Chinese unit produced 2.56 seconds of audio on MacBook MPS. This verifies a short inference path, not full-sermon throughput, voice quality or human listening acceptance. Runtime unavailability may route to Spark; voice identity, text and review requirements remain mandatory.", "底座：Qwen/Qwen3-TTS-12Hz-1.7B-Base。复用已登记讲员检查点，不必每周重训。MacBook MPS 已将一个 10 字中文单元合成为 2.56 秒音频；这只验证短样本推理路径，不代表整篇吞吐、音质或人工听审通过。环境不可用时可转 Spark，声音身份、文字与审核要求保持不变。", "../experiments/sermon-dubbing-poc/render_weekly_audio.py"], ["09", 1, "ALIGNMENT & QA", "对齐与质检", "Check every segment and align playback", "逐段检查并对齐播放时间", "Locate English words in the source audio, transcribe each Chinese audio unit back to text, and compare it with the script. Fit complete Chinese passages into the source timeline.", "在原声中定位英文词语，把每个中文音频单元回转写后与口播稿对比，再将完整中文段落安排到原声时间线上。", "MacBook primary → DGX Spark fallback · Qwen3-ASR + Qwen3-ForcedAligner", "MacBook 优先 → DGX Spark 备用 · Qwen3-ASR + Qwen3-ForcedAligner", "Alignment report + synchronized MP3 / cues", "对齐报告、同步 MP3 与字幕时间", "Local QA models prefer MacBook; DGX Spark is the configured fallback for runtime or inference availability. Each backend preserves its own pinned model identity and evidence; changing a backend cannot reuse incompatible receipts. The separate MFA reading stage preserves frozen English. Overlong passages return to script review and synthesis. ASR differences are review clues, not a measured TTS error rate; failed content or alignment checks do not trigger fallback.", "质检模型优先在 MacBook 推理，运行环境或推理不可用时使用已配置的 DGX Spark 备用。每个后端保留各自固定模型身份与证据，切换后端不能复用不兼容收据。前面的 MFA 阅读对齐单独保留冻结英文；超时段返回审稿与合成。ASR 差异是复查线索，不直接等于配音错误率；内容或对齐校验失败不能触发备用重试来绕过审核。", "sermon-dubbing-system-design.zh.md"], ["10", 2, "LISTENING REVIEW", "听审", "Review the exact final audio", "审核本次最终音轨", "Listen against the same source video. Check speaker identity, voice similarity, fluency, pronunciation, omissions or repetition, and synchronization. Bind the review to the exact audio version.", "对照同一来源视频听审，检查讲员身份、音色相似度、流畅度、发音、漏读／重复与同步，并将审核绑定到具体音轨版本。", "Human listening + programmatic validation", "人工听审 + 程序校验", "Formal approval, or a labeled review preview", "正式审核收据，或明确标注的待审候选", "An accepted voice sample does not approve a new full sermon. A preview may be built with a visible pending-review label; formal release requires the matching review and upstream completion evidence.", "某个声音样片获认可，不自动批准新一篇完整证道。候选可带“待审”标识构建；正式版需匹配的听审收据与上游完成证据。", "../experiments/sermon-dubbing-poc/SATURDAY_AUDIO_RUNBOOK.zh.md"], ["11", 2, "SOUND MATCHING", "听音定位", "Build the source-audio fingerprint index", "生成原声听音定位指纹", "As a required part of building each new weekly page, extract spectral landmarks from the approved source window. Bind the index to the source file, sermon window, synchronized Chinese track and page ID.", "将听音定位纳入每个新周次页面的必备制作步骤：从已确认范围的原声提取频谱特征，并绑定来源文件、证道范围、中文同步音轨和页面 ID。", "No AI · build_weekly_app.py → build_fingerprint_index.mjs + FFmpeg", "无模型 · build_weekly_app.py → build_fingerprint_index.mjs + FFmpeg", "Versioned landmark index + source / track hashes", "版本化声音指纹索引及来源／音轨哈希", "build_weekly_app.py generates the index by default: formal pages and sync-preview builds require it without an extra flag. The builder checks the source SHA-256, decodes the selected window to 8 kHz mono audio and extracts spectral landmarks. The index records the algorithm version, page ID, source / track hashes and absolute start / end times. Publish the index, not the original PCM. It matches playback of this same recording; it does not recognize a different performance or replace production word alignment.", "build_weekly_app.py 默认调用指纹生成器；正式页面和 sync-preview 构建固定要求该索引，无需额外开关。构建器核对来源 SHA-256，将选定范围解码为 8 kHz 单声道音频，提取频谱特征。索引记录算法版本、页面 ID、来源／音轨哈希与绝对起止时间。发布索引，不发布原始 PCM；它匹配同一录制的播放，不用于识别另一场演讲，也不替代制作阶段的词级对齐。", "../experiments/sermon-dubbing-poc/build_fingerprint_index.mjs"], ["12", 2, "PAGE BUILD", "页面构建", "Turn the content into a new page", "把内容组装成新页面", "Combine the week, transcript, companion and reviewed audio into a static page package. Include the fingerprint index and its binding to this page and its synchronized track.", "将周次、双语稿、大纲与经审音轨组装成静态页面包，同时纳入声音指纹索引，以及索引与本页、同步音轨的绑定记录。", "No AI · build_weekly_app.py", "无模型 · build_weekly_app.py", "weekly.json + page assets + fingerprint binding", "weekly.json、页面资源与声音指纹绑定", "The page’s audioFingerprint metadata records the index URL and SHA-256 alongside its source, window, page and track identity. A stale index must not be paired with a changed source or synchronized track. Automatic sound matching belongs to the synchronized track, whose duration matches the source window; the natural listening track uses a different timeline. An unsynchronized natural-speed review-preview is only an intermediate candidate; automatic sound matching is unavailable until synchronized audio and its fingerprint binding are built.", "页面的 audioFingerprint 元数据记录索引地址与 SHA-256，并绑定来源、范围、页面和音轨身份。来源或同步音轨变更后，不能沿用不匹配的旧索引。自动听音定位使用与原声范围等长的同步音轨；自然聆听音轨的时间轴不同。 未同步的自然语速 review-preview 只是中间候选，不能自动听音定位；需完成同步音轨与指纹绑定后才具备该能力。", "../experiments/sermon-dubbing-poc/build_weekly_app.py"], ["13", 2, "RELEASE", "发行", "Merge the week and publish", "合入新周次并发布", "Merge the candidate into the release registry while preserving historical pages. Inspect the release plan, then publish the explicit file list to the dedicated Firebase Hosting site.", "将本周候选合入发行清单并保留历史页面，检查发行差异，再将明确列出的文件发布到独立 Firebase Hosting 站点。", "No AI · weekly_release.py + deploy_firebase.py", "无模型 · weekly_release.py + deploy_firebase.py", "Versioned release + hosted content", "版本化发行包与线上内容", "Existing page replacements must be explicit. The release process preserves each page’s source and review status; it does not upgrade a candidate to an approved edition. Check fingerprint bytes and all page / source / window / track bindings before release. Include the index in the release file manifest and verify the hosted copy after publication.", "替换已有页面必须明确指定。发行过程保留各页的来源与审核状态，不会把候选自动升级为正式通过版本。 发行前核对指纹文件及页面／来源／范围／音轨绑定；将索引列入发行文件清单，发布后核验线上副本。", "tongxing-weekly-release.zh.md"], ["14", 2, "IN THE APP", "App 验收", "Verify the page people actually open", "核验用户实际打开的新页面", "Verify the hosted files and audio range requests, then open the new page on a device. Test playback, text jumps and automatic sound matching against the same source recording.", "核验线上文件和音频分段请求，再用设备打开新页面，测试播放、文字跳转，以及针对同一原声录制的自动听音定位。", "No AI · HTTP checks + device testing", "无模型 · HTTP 检查 + 设备测试", "A verified new weekly page", "经过核验的本周新页面", "The listener starts sound matching and grants microphone permission. The player pauses Chinese audio, captures about 10 seconds and matches locally in a Web Worker; microphone audio is not uploaded. A reliable, current match seeks the synchronized Chinese track and starts playback, accounting for time spent matching. If the browser blocks playback, a button lets the listener resume. Low-confidence, expired or mismatched results do not jump. Test permission denial and no-match recovery too. Hosted-file checks, device tests and real-venue acceptance are separate evidence.", "听众主动启动听音定位并授权麦克风后，播放器暂停中文音频，采集约 10 秒声音，在本机 Web Worker 内匹配，不上传麦克风音频。可靠且未过期的结果会补偿匹配耗时，自动跳转中文同步音轨并播放；若浏览器阻止播放，保留按钮供听众继续。低置信度、过期或绑定不符时不跳转。还需测试拒绝授权与未匹配后的恢复；线上文件核验、设备测试与真实现场验收分别留证。", "../experiments/sermon-dubbing-poc/web/fingerprint-ui.mjs"]];
const copy={"en": {"title": "From video to Sunday.", "subtitle": "How Tongxing turns an English sermon into a Chinese listening experience — one traceable step at a time.", "eyebrow": "TONGXING / THE WEEKLY WORKFLOW", "overview": "Explore the workflow", "models": "Meet the models", "print": "Print / Save PDF", "nav": "Guide navigation", "lang": "Interface language", "phase": ["Establish the source", "Create the Chinese experience", "Bring it into Tongxing"], "phaseSub": ["Video → frozen English → MFA word alignment → reviewed Chinese", "Reviewed text → voice → synchronized audio", "Listening review → sound matching → page → verified release"], "flow": ["Video", "English + word times", "Chinese", "Voice", "New page"], "steps": "14 steps", "layers": "3 stages", "default": "English / 中文", "mapTitle": "A small team of models. Distinct jobs.", "mapText": "Local models prefer MacBook with DGX Spark fallback. MacBook MFA and speaker-checkpoint TTS have passed real short-sample checks; full-sermon performance and listening review remain separate. Cloud transcription and language models use APIs, Mac mini can relay jobs, and listener devices match audio fingerprints deterministically.", "modelCols": ["Model / method", "Its job", "Where it runs"], "modelRows": [["gpt-transcribe", "English transcription of the selected sermon audio", "OpenAI API"], ["gpt-6-astra · Medium", "Translation, reading review, companion content, CUV review; production supervision", "OpenAI API / recorded review workflow"], ["MFA + G2P", "Align frozen English to audio; optional G2P covers missing dictionary words; does not reclassify sentence endings", "MacBook primary / DGX Spark fallback"], ["Qwen3-TTS · 1.7B + speaker SFT", "Chinese speech using the registered speaker checkpoint", "MacBook primary / DGX Spark fallback; local short sample verified"], ["Qwen3-ASR · 0.6B", "Source-audio assistance and Chinese audio back-transcription", "MacBook primary / DGX Spark fallback"], ["Qwen3-ForcedAligner · 0.6B", "Dubbing QA: source-word anchors; reading production uses MFA", "MacBook primary / DGX Spark fallback"], ["Spectral landmarks · no AI model", "Same-recording microphone matching against the prepared source index", "Local build / browser Web Worker"]], "sideTitle": "What does OpenAI Agents API do here?", "sideText": "Agents API hosts the Supervisor session and model/tool loop. Astra Medium interprets the permitted state and requests a named operation. Our local runner executes that function and submits its result, then the agent can inspect the new state.", "sideFoot": "The project retains environment: none and exposes only minimal status. The default scope remains source preparation and dual PDFs. With explicit --release-workflow-config, the Supervisor can continue through dubbing, synchronization, page building, release preparation, authorized deployment, HTTP verification and registration. Local jobs persist across disconnects; human listening review and release authorization remain required. Uncertain outcomes stop automatic retries. Existing schedules are not automatically switched; code tests do not establish full-sermon or online acceptance.", "output": "OUTPUT", "detail": "How it works & evidence", "source": "View implementation reference ↗", "resultTag": "THE RESULT", "resultTitle": "A new week. Ready to follow along.", "resultText": "One entry brings together Chinese audio, the English / Chinese transcript, the sermon companion and clear source and review information.", "resultList": ["Listen in Chinese", "Match the original sound and join playback", "Follow the bilingual text", "Explore the message outline", "Return to previous weeks"], "sourcesTitle": "Built from the project’s actual workflow", "sourcesText": "Updated September 19, 2026. Source preparation now verifies media without boundary models; sermon times come from the operator. Legacy report/tool names remain for recovery compatibility. Code and offline checks are separate from deployment and live acceptance. This page covers prepared weekly content. New-page production includes source fingerprint preparation, binding, release validation and device sound-matching checks; this description is not a live-venue acceptance receipt. Local models prefer MacBook with DGX Spark fallback. MacBook MFA and TTS short samples have been verified; full-sermon execution and listening review remain separate. MFA reading sentence boundaries still follow frozen-text punctuation.", "sources": ["Local production runbook", "CUV translation and review", "Dubbing system and model roles", "Weekly App release"], "footer": "Tongxing is an independent personal project, not affiliated with, endorsed by, or operated by Mariners Church. Original sermon attribution stays with the source.", "back": "Back to top ↑", "docTitle": "Tongxing · From video to Sunday", "toolsTitle": "Which tools do the non-AI work?", "toolsText": "“Deterministic” means code follows explicit rules: read files, compare hashes, calculate durations and produce files. Human approval is recorded separately.", "toolsRows": [["Inference routing and evidence checks", "MacBook → DGX Spark fallback · optional Mac mini relay", "Prefer local inference; select fallback only for runtime or inference availability. Record actual backend and model identity. Text, alignment, voice-identity and review failures remain blocking.", "mfa-production.zh.md"], ["Media retrieval & inspection", "yt-dlp · FFmpeg · ffprobe", "Download authorized media, extract or cut audio, inspect duration and fully decode the output.", "codex-local-production-runbook.zh.md"], ["Source, approval & concurrency checks", "sermon_production_supervisor.py · backend/leases.py", "Match approval to its source and media-evidence hash; reject times beyond the measured duration; use leases to prevent overlapping production runs.", "../scripts/sermon_production_supervisor.py"], ["Exact Scripture lookup", "cuv_scripture.py · CuvLibrary", "Retrieve the fixed CUV verse text and verify the library identity. Model-selected quotations must match exact library text.", "../scripts/cuv_scripture.py"], ["PDF layout", "render_mobile_pdf_from_srt.py · render_sermon_interpretation_pdf.py · ReportLab", "Lay out the reviewed reading text and companion content into the two PDF documents.", "../scripts/render_sermon_interpretation_pdf.py"], ["Audio assembly & timing", "render_weekly_audio.py assembly stage · check_weekly_timing.py · FFmpeg", "Combine generated WAVs, normalize loudness, measure slots and assemble complete speech with gaps. TTS inference is the separate model stage above.", "../experiments/sermon-dubbing-poc/check_weekly_timing.py"], ["Sound-matching index & playback", "build_weekly_app.py → build_fingerprint_index.mjs · fingerprint-worker.mjs · fingerprint-ui.mjs", "Extract landmarks, bind the index to the source window and synchronized track, then match microphone audio locally and seek/play only a valid result.", "../experiments/sermon-dubbing-poc/build_fingerprint_index.mjs"], ["Page packaging & release", "build_weekly_app.py · weekly_release.py · deploy_firebase.py", "Write weekly.json, copy the static UI and media, preserve historical pages and deploy the explicit release files.", "tongxing-weekly-release.zh.md"], ["Published-file verification", "verify_weekly_release.py · HTTP GET / Range · SHA-256", "Download the hosted assets, verify bytes and hashes, and test audio range requests.", "../experiments/sermon-dubbing-poc/verify_weekly_release.py"], ["Human review", "Operator viewing · same-video listening · device checks", "Confirm the sermon window; listen to the exact final track; check real-device playback. Save version-bound review receipts.", "../experiments/sermon-dubbing-poc/SATURDAY_AUDIO_RUNBOOK.zh.md"], ["Optional full-workflow orchestration", "--release-workflow-config", "Named tools start and inspect durable jobs; completion requires publication registration and HTTP evidence.", "agents-end-to-end-workflow.zh.md"]], "agentLoop": ["Scheduled local runner starts or resumes the session", "Agents API runs Astra Medium and requests a tool", "Local Python checks permission and executes the stage", "The result returns to the session; fresh state is inspected"], "agentToolTitle": "Supervisor tools relevant to this workflow", "agentTools": [["inspect_production_state", "Read source, approval, leases, QA and the next permitted action."], ["run_timeline_probe", "Legacy name: download and verify complete source media, without transcription or boundary models."], ["run_approved_reading_pdf_generation", "Run dual-PDF production only with valid existing human approval."], ["submit_supervisor_decision", "Record a structured outcome for independent local verification."]], "agentRefs": "Project adapter", "agentOfficial": "OpenAI Docs: Agents API architecture", "parallelTitle": "Independent branches run together. Dependencies still join.", "parallelText": "Chunked transcription and the two PDF branches each default to two workers; single-request full-file transcription is unchanged. MacBook dubbing admits at most two model tasks and queues below 12 GiB available memory at launch. This is not a post-load memory guarantee.", "parallelRows": [["Source processing", "Chunked transcription ∥ source fingerprint precompute. Frozen English → MFA → Chinese remains ordered."], ["Reading and dubbing", "Reading PDF ∥ companion generation. Once reading text and companion are ready and dubbing prerequisites pass, the audio candidate can overlap PDF rendering."], ["Audio processing", "Source alignment ∥ TTS. Screen assembled Chinese audio with ASR, then join both branches before timing checks."], ["Join and release", "Complete PDFs, audio checks and human listening review remain release requirements. Bind source fingerprints to the actual completed Chinese track."]], "parallelEvidence": "Real MacBook short sample: MPS TTS and MLX ASR inference calls overlapped by about 1.69 seconds; minimum sampled available
