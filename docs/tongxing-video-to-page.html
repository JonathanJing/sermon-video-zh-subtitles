  <script>

    const copy={
      en:{title:"Four layers. One shared English truth.",eyebrow:"FOUR-LAYER MULTILINGUAL PRODUCTION",intro:"Prepared multilingual production now moves through four explicit contracts. Each layer owns its process, models, evidence gate and immutable output; passing one layer never proves the next.",view:"View the four layers",contract:"Canonical interface contract",figure:"Native editable SVG rebuilt from the ImageGen visual reference and corrected against repository contracts.",statusLabel:"Current implementation",status:"Layer 1 has a deterministic producer in shadow. The general Layer 2–4 producers are still migrating. Existing Chinese PDF, dubbing and weekly-page tools remain scoped legacy adapters. The legacy page builder currently triggers fingerprint generation; the target architecture assigns generation to Layer 3 and only publication/use to Layer 4.",input:"Input",process:"Process",models:"Models + deterministic tools",output:"Output",gate:"Gate",current:"Current status",connections:"One shared source, independent language lanes",connectionsText:"The English package is created once. Chinese, Korean and Spanish branch directly from English, then each locale independently passes Layers 2, 3 and 4.",shared:"Shared once",sharedText:"Canonical English, word timing, sentence/clause anchors, provenance and review evidence.",zh:"Current primary lane",zhText:"Legacy Chinese translation, TTS and release adapters work; canonical general producers are still migrating.",ko:"Korean lane",koText:"Interface/schema and speech-job preparation exist; real translation, TTS, synchronization and release remain unverified.",es:"Spanish lane",esText:"Defined by the frozen interfaces and backlog; production adapters and acceptance evidence remain to be built.",liveTitle:"Separate lane: Sunday live captions",liveText:"The current default live_session uses local Qwen3-ASR for English finals and MiLMMT Q8 for immediate Chinese translation, with a constrained installed Whisper fallback. It prioritizes low latency and recovery recording, and does not generate the four prepared-production packages during the service. Durable reuse of a finalized recording starts again at Layer 1.",agentTitle:"Cross-layer orchestration: Supervisor Agent",agentText:"GPT-6 Astra may inspect state and call bounded deterministic tools. It cannot invent timestamps, grant human approval, repair upstream content downstream, or promote legacy completion to four_layer_release.",matrixTitle:"Model responsibility map",matrixText:"Models are replaceable tools inside a layer. Their receipts and limits travel with the package; no model output silently becomes source truth or human approval. The spectral-landmark fingerprint is deterministic audio processing, not a speaker-biometric model.",cols:["Model / tool","Layer","Responsibility","Hard boundary"],refsTitle:"Contracts and source documents",refsText:"This page is an explanatory view. Schemas, runbooks and bound run receipts remain authoritative. HTTP, fingerprint, device and venue acceptance are always separate evidence.",refs:["Four-layer interfaces","Local production runbook","Sentence anchoring design","Dubbing system design","Weekly release contract","Field audio alignment","Open the SVG"],print:"Print / Save PDF",back:"Back to top ↑",footer:"Independent personal project; not affiliated with or endorsed by Mariners Church. Use only public or authorized media and preserve source attribution.",layers:"4 layers",languages:"zh-Hans · ko · es"},
      zh:{title:"四层生产，共享一份英文事实。",eyebrow:"四层多语言生产",intro:"今后的预制多语言生产统一经过四个明确合同。每一层分别拥有流程、模型分工、证据门禁和不可变输出；上一层通过，不代表下一层已经通过。",view:"查看四层流程",contract:"打开正式接口合同",figure:"原生可编辑 SVG：先由 ImageGen 生成视觉参考，再按仓库事实校正文案和连接关系。",statusLabel:"当前实现",status:"Layer 1 已有确定性 producer 并进入 shadow；通用 Layer 2–4 producer 仍在迁移。现有中文 PDF、配音与每周页面工具继续作为明确范围的 legacy adapter。当前 legacy 页面 builder 仍代为触发指纹生成；目标架构把生成职责放在 Layer 3，Layer 4 只负责发布和使用。",input:"输入",process:"流程",models:"模型与确定性工具",output:"输出",gate:"门禁",current:"当前状态",connections:"一个英文主干，各语言独立分支",connectionsText:"English Source Package 只建立一次。中文、韩语和西班牙语都直接从英文分叉，然后分别完成自己的 Layer 2、3、4。",shared:"只生成一次",sharedText:"规范英文、字词时间、句／分句锚点、来源与审核证据。",zh:"当前主生产语言",zhText:"现有中文翻译、TTS 与发布 adapter 可工作；通用 canonical producer 仍在迁移。",ko:"韩语分支",koText:"界面、schema 与 speech-job 准备已实现；真实翻译、TTS、同步和发布尚未验收。",es:"西班牙语分支",esText:"已纳入冻结接口与 backlog；生产 adapter 和实际验收证据尚待实现。",liveTitle:"独立旁路：周日实时字幕",liveText:"当前默认 live_session 使用本地 Qwen3-ASR 生成英文 final，再由 MiLMMT Q8 即时翻译中文；已安装的 Whisper 仅是受限 fallback。现场优先低延迟和独立恢复录音，不生成四个预制生产包。若会后持久复用最终录音，必须重新从 Layer 1 建立来源与英文锚点。",agentTitle:"跨层编排：Supervisor Agent",agentText:"GPT-6 Astra 可以检查状态并调用受限确定性工具，但不能伪造时间戳、自授人工批准、在下游修补上游内容，或把 legacy complete 提升成 four_layer_release。",matrixTitle:"模型职责表",matrixText:"模型是层内可替换工具；模型身份、收据和限制随 package 保存。任何模型输出都不会静默升级为事实来源或人工批准。频谱地标指纹是确定性音频处理，不是识别讲员身份的生物声纹模型。",cols:["模型／工具","所属层","职责","硬边界"],refsTitle:"合同与来源文档",refsText:"本页用于解释流程；正式 schema、runbook 和绑定运行收据仍是事实依据。HTTP、指纹、设备和现场验收始终分别留证。",refs:["四层接口","本地生产 Runbook","句级锚定设计","配音系统设计","每周发行合同","现场声音定位","打开 SVG"],print:"打印／另存 PDF",back:"返回顶部 ↑",footer:"这是独立个人项目，与 Mariners Church 无隶属或背书关系。只处理公开或已授权媒体，并保留来源署名。",layers:"4 个生产层",languages:"zh-Hans · ko · es"}
    };

    const layers=[
      {className:"l1",number:"01",title:pair("Shared English Source & Anchors","共享英文事实与锚点"),subtitle:pair("Stabilize what was said and when.","先稳定原文说了什么、何时说。"),input:[pair("Authorized media identity and operator-approved sermon window","授权媒体身份与操作员批准的证道范围"),pair("Frozen English transcript or trustworthy manuscript","冻结英文转写或可信原稿")],process:[pair("Recover and correct complete English, preserving repetitions, repairs and unintelligible markers","恢复并校订完整英文，保留重复、修正和不可辨识标记"),pair("Align words acoustically, then build sentence, clause, punctuation and pause anchors","做词级声学对齐，再建立句、分句、标点与停顿锚点"),pair("Freeze provenance, coverage, issues, hashes and invalidation identity","冻结来源、覆盖率、问题、hash 与失效身份")],models:[{name:"gpt-transcribe",role:pair("English file ASR when trustworthy text is unavailable.","缺少可信英文时执行文件 ASR。"),limit:pair("Machine transcription is not human-verified verbatim text.","机器转写不等于人工逐字核验稿。")},{name:"MFA / Qwen3-ForcedAligner",role:pair("Selected provider supplies word-level acoustic timing; A/B runs stay separate.","选择其中一个 provider 生成词级声学时间；A/B 结果保持分离。"),limit:pair("Forced alignment does not decide the correct English or semantic boundary.","强制对齐不判断正确英文或语义边界。")},{name:"gpt-6-astra",role:pair("Corrects English and reviews punctuation and sentence/clause boundaries.","校订英文并审核标点与句／分句边界。"),limit:pair("Language reasoning must never invent acoustic timestamps.","语言判断不得伪造声学时间戳。") }],output:[pair("English Source Package","English Source Package"),pair("Immutable anchor manifest, word times, source identity and review receipts","不可变锚点、字词时间、来源身份与审核收据")],gate:pair("ready_for_translation: source, completeness, alignment and sentence/pause review all bound.","ready_for_translation：来源、完整性、字词对齐和句／停顿审核全部绑定。"),current:pair("Producer implemented in shadow; without the English human-review receipt it remains candidate_ready_for_translation.","producer 已进入 shadow；缺少英文人工审核收据时仍是 candidate_ready_for_translation。")},
      {className:"l2",number:"02",title:pair("Target-Language Text","目标语言文字"),subtitle:pair("Generate every reviewed target-language text artifact from English.","从英文生成并审核全部目标语言文字。"),input:[pair("A ready_for_translation English Source Package","ready_for_translation 的 English Source Package"),pair("targetLocale plus frozen translation, terminology, Scripture and formatting policy","targetLocale 与冻结的翻译、术语、经文和排版策略")],process:[pair("Translate requested sourceUnitIds directly from English; neighboring units only disambiguate","从英文直译指定 sourceUnitIds；相邻单元只用于消歧"),pair("Create the reading edition and companion/outline text, then review them in separate requests","生成阅读版与证道同行／大纲文字，再用不同 request 复核"),pair("Classify Scripture use, retrieve approved exact CUV text and check omissions, negation, names and numbers","分类经文用法、取出已确认的精确 CUV，并检查漏义、否定、专名与数字")],models:[{name:"gpt-6-astra · medium",role:pair("Chinese translation, two-pass reading edits, companion/outline generation, Scripture-aware revision and independent review.","中文翻译、阅读版两轮编辑、证道同行／大纲生成、经文相关修订与独立复核。"),limit:pair("Model review remains model review until human text approval is recorded.","未记录人工文字批准前，模型审核仍只是模型审核。")},{name:"locale-specific adapter",role:pair("Korean and Spanish may use their own translator, reviewer, prompt and terminology set.","韩语和西班牙语可使用各自的翻译、复核模型、prompt 与术语表。"),limit:pair("Real ko/es production translation has not yet been accepted.","真实 ko/es 生产翻译尚未验收。")},{name:"CuvLibrary",role:pair("Deterministically retrieves exact Chinese Union Version text for approved references.","对已确认引用确定性取出精确和合本文字。"),limit:pair("The library does not decide whether a passage is a direct quotation.","经文库不判断某段是否属于直接引文。") }],output:[pair("One Target-Language Candidate per locale","每个 locale 一份 Target-Language Candidate"),pair("Reviewed translation, reading-edition and companion/outline text with model receipts","获审译文、阅读版及证道同行／大纲文字与模型收据")],gate:pair("human_translation_approved: complete meaning and language-specific review approved.","human_translation_approved：完整语义和语言专属审核均获批准。"),current:pair("The Chinese legacy runner works; the general Layer 2 producer and real Korean/Spanish runs are not complete.","中文 legacy runner 可工作；通用 Layer 2 producer 及真实韩语／西班牙语运行尚未完成。")},
