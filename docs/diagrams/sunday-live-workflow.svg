<text x="88" y="1249" font-size="18" font-weight="500" fill="#e7f1f8" text-anchor="start" >现场录音和控制接口不向观看者开放；只读分享仅发布允许字幕。现场音频不被周六稿替换。</text>
<text x="88" y="1276" font-size="18" font-weight="500" fill="#e7f1f8" text-anchor="start" >重连沿用同一会话并标记缺口；saved 不代表字幕无中断。人工语义、实体设备与现场验收仍须独立完成。</text>
