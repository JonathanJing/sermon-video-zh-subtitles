<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-labelledby="title desc">
<title id="title">Sunday workflow · 周日操作与故障流程</title><desc id="desc">Independent recording continues through model failure · 有缺口就记录，不把恢复写成无损</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526580"/></marker><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#18304b}.title{font-size:30px;font-weight:700}.subtitle{font-size:16px;fill:#536782}.head{font-size:20px;font-weight:700}.body{font-size:17px}.note{font-size:15px;fill:#536782}.edge{fill:none;stroke:#526580;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}</style></defs>
<rect width="1400" height="960" rx="20" fill="#f5f8fc"/>
<text x="44" y="55" class="title" text-anchor="start">Sunday workflow · 周日操作与故障流程</text>
<text x="44" y="86" class="subtitle" text-anchor="start">Independent recording continues through model failure · 有缺口就记录，不把恢复写成无损</text>
<rect x="44" y="126" width="390" height="150" rx="14" fill="#edf4ff" stroke="#86abe6" stroke-width="1.5"/>
<text x="64" y="159" class="head" text-anchor="start">1 · Preflight / 预检</text>
<text x="64" y="189" class="body" text-anchor="start">Start launcher; verify runtime identity</text>
<text x="64" y="215" class="body" text-anchor="start">Select actual microphone / check level</text>
<text x="64" y="241" class="body" text-anchor="start">Optional Pack readiness; default none</text>
<rect x="504" y="126" width="390" height="150" rx="14" fill="#eaf8f1" stroke="#70b897" stroke-width="1.5"/>
<text x="524" y="159" class="head" text-anchor="start">2 · Capture / 双路径采集</text>
<text x="524" y="189" class="body" text-anchor="start">MediaRecorder chunks → Gateway disk</text>
<text x="524" y="215" class="body" text-anchor="start">Worklet PCM → WS → VAD → ASR</text>
<text x="524" y="241" class="body" text-anchor="start">Record audio even if models fail</text>
<rect x="964" y="126" width="392" height="150" rx="14" fill="#f3efff" stroke="#aa98dc" stroke-width="1.5"/>
<text x="984" y="159" class="head" text-anchor="start">3 · Translate / 翻译</text>
<text x="984" y="189" class="body" text-anchor="start">Immutable English final only</text>
<text x="984" y="215" class="body" text-anchor="start">Lexical guard → immediate MiLMMT</text>
<text x="984" y="241" class="body" text-anchor="start">No Saturday transcript substitution</text>
<path d="M434 201H504" class="edge"/>
<path d="M894 201H964" class="edge"/>
<rect x="964" y="366" width="392" height="150" rx="14" fill="#eaf8f1" stroke="#70b897" stroke-width="1.5"/>
<text x="984" y="399" class="head" text-anchor="start">4 · Read + share / 呈现</text>
<text x="984" y="429" class="body" text-anchor="start">Readable current + previous bilingual</text>
<text x="984" y="455" class="body" text-anchor="start">Local UI / LAN SSE / Firebase HTTPS</text>
<text x="984" y="481" class="body" text-anchor="start">Phone fitting; render timing on operator</text>
<path d="M1160 276V366" class="edge"/>
<rect x="504" y="366" width="390" height="150" rx="14" fill="#edf4ff" stroke="#86abe6" stroke-width="1.5"/>
<text x="524" y="399" class="head" text-anchor="start">5 · Stop + drain / 停止</text>
<text x="524" y="429" class="body" text-anchor="start">Stop input; finish audio uploads</text>
<text x="524" y="455" class="body" text-anchor="start">Latest WS epoch closes workers/storage</text>
<text x="524" y="481" class="body" text-anchor="start">Then finalize manifest, WAV and hashes</text>
<rect x="44" y="366" width="390" height="150" rx="14" fill="#fff5e9" stroke="#e1aa68" stroke-width="1.5"/>
<text x="64" y="399" class="head" text-anchor="start">6 · Verify + retain / 保存验证</text>
<text x="64" y="429" class="body" text-anchor="start">Download recovery copy / event log</text>
<text x="64" y="455" class="body" text-anchor="start">Decode + sequence + hash + status</text>
<text x="64" y="481" class="body" text-anchor="start">Saved ≠ uninterrupted or human reviewed</text>
<path d="M964 441H894" class="edge"/>
<path d="M504 441H434" class="edge"/>
<rect x="44" y="640" width="390" height="170" rx="14" fill="#fff5e9" stroke="#e1aa68" stroke-width="1.5"/>
<text x="64" y="673" class="head" text-anchor="start">Failure: model / 模型故障</text>
<text x="64" y="703" class="body" text-anchor="start">Continue independent recording</text>
<text x="64" y="729" class="body" text-anchor="start">ASR failure → explicit fault state</text>
<text x="64" y="755" class="body" text-anchor="start">Translation failure → English / error</text>
<text x="64" y="781" class="body" text-anchor="start">No silent replacement with prepared text</text>
<rect x="504" y="640" width="390" height="170" rx="14" fill="#fff5e9" stroke="#e1aa68" stroke-width="1.5"/>
<text x="524" y="673" class="head" text-anchor="start">Failure: connection / 连接故障</text>
<text x="524" y="703" class="body" text-anchor="start">Resume same session and viewer identity</text>
<text x="524" y="729" class="body" text-anchor="start">Backfill recording by durable sequence</text>
<text x="524" y="755" class="body" text-anchor="start">Record PCM gaps / missing ASR outcomes</text>
<text x="524" y="781" class="body" text-anchor="start">Stop safely if recovery cannot finish</text>
<rect x="964" y="640" width="392" height="170" rx="14" fill="#fff5e9" stroke="#e1aa68" stroke-width="1.5"/>
<text x="984" y="673" class="head" text-anchor="start">Failure: public network / 公网</text>
<text x="984" y="703" class="body" text-anchor="start">Bounded publisher does not block locally</text>
<text x="984" y="729" class="body" text-anchor="start">Viewer reconnects; retain prior caption</text>
<text x="984" y="755" class="body" text-anchor="start">Use LAN if venue allows device access</text>
<text x="984" y="781" class="body" text-anchor="start">Physical mobile path still needs testing</text>
<path d="M1110 276V320H24V610H239V640" class="edge dash"/>
<path d="M699 276V336H464V590H699V640" class="edge dash"/>
<path d="M1160 516V640" class="edge dash"/>
<text x="44" y="911" class="note" text-anchor="start">Default: Qwen3-ASR + MiLMMT Q8 · 3 s max / 500 ms silence · content_words · legacy units · readable_chunks · no Pack.</text>
<text x="44" y="936" class="note" text-anchor="start">Acceptance: 60-minute browser WAV replay is delivery evidence, not venue input, phone latency, or semantic accuracy.</text>
</svg>
