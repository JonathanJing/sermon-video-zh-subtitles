<text x="126" y="303" font-size="17" font-weight="750" fill="#ad751c" text-anchor="middle" >01</text>
<text x="164" y="303" font-size="16" font-weight="700" fill="#ad751c" text-anchor="start" >门槛 / GATE</text>
<text x="104" y="346" font-size="26" font-weight="700" fill="#17314e" text-anchor="start" >启动预检</text>
