<text x="614" y="1103" font-size="18" font-weight="400" fill="#5b748c" text-anchor="start" >保留字幕事件与断流缺口</text>
<text x="614" y="1127" font-size="18" font-weight="400" fill="#5b748c" text-anchor="start" >保存成功不代表人工审核</text>
