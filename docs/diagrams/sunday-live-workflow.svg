<text x="104" y="399" font-size="18" font-weight="400" fill="#5b748c" text-anchor="start" >检查麦克风、网络与模型身份</text>
<text x="104" y="423" font-size="18" font-weight="400" fill="#5b748c" text-anchor="start" >默认本地模型与无增强路径</text>
<text x="104" y="447" font-size="18" font-weight="400" fill="#5b748c" text-anchor="start" >实验仅本机，无分享或包</text>
