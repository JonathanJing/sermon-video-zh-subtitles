<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1350" viewBox="0 0 1600 1350" role="img" aria-labelledby="title desc">
<title id="title">周日现场字幕与录音</title><desc id="desc">当前英文驱动字幕，独立音频持续保存，停止后核对完整证据 现场录音和控制接口不向观看者开放；只读分享仅发布允许字幕。现场音频不被周六稿替换。 重连沿用同一会话并标记缺口；saved 不代表字幕无中断。人工语义、实体设备与现场验收仍须独立完成。</desc>
