<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Solution journey for Sunday live Chinese captions</title>
  <desc id="desc">A bilingual diagram showing the Sunday caption gap, limits of generic live translation, the rejected assumption that Saturday and Sunday deliveries match word for word, the current guarded hybrid, and a gated post-training path.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .stage { font-size: 13px; font-weight: 700; letter-spacing: .7px; fill: #475569; }
      .card-title { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; fill: #334155; }
      .small { font-size: 12px; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="720" rx="20" fill="#f8fafc"/>
  <text x="54" y="52" class="title">Why the workflow evolved / 方案为什么这样演进</text>
  <text x="54" y="80" class="subtitle">Observed constraints lead to a guarded hybrid; future enhancement remains evidence-gated.</text>

  <text x="54" y="118" class="stage">OBSERVED JOURNEY / 已观察到的演进</text>

  <rect x="54" y="138" width="232" height="142" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="80" cy="164" r="14" fill="#334155"/>
  <text x="80" y="169" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="104" y="169" class="card-title">Sunday gap / 周日缺口</text>
  <text x="76" y="205" class="body">No dependable Chinese captions</text>
  <text x="76" y="228" class="body">现场缺少可靠中文字幕</text>
  <text x="76" y="256" class="small">Need: readable, timely, faithful</text>

  <path d="M 286 209 L 318 209" class="arrow"/>

  <rect x="320" y="138" width="250" height="142" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="346" cy="164" r="14" fill="#d97706"/>
  <text x="346" y="169" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="370" y="169" class="card-title">Generic live translation</text>
  <text x="342" y="198" class="body">通用实时翻译</text>
  <text x="342" y="225" class="small">Scripture + terminology quality</text>
  <text x="342" y="246" class="small">Segmentation + latency stability</text>
  <text x="342" y="267" class="small">经文、术语、分段与延迟不稳定</text>

  <path d="M 570 209 L 602 209" class="arrow"/>

  <rect x="604" y="138" width="236" height="142" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="630" cy="164" r="14" fill="#2563eb"/>
  <text x="630" y="169" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="654" y="169" class="card-title">First hypothesis / 初设</text>
  <text x="626" y="205" class="body">Reuse Saturday transcript</text>
  <text x="626" y="228" class="body">周六提取并翻译后复用</text>
  <text x="626" y="256" class="small">Same message framework?</text>

  <path d="M 840 209 L 872 209" class="arrow"/>

  <rect x="874" y="138" width="272" height="142" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <circle cx="900" cy="164" r="14" fill="#dc2626"/>
  <text x="900" y="169" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <text x="924" y="169" class="card-title">Boundary found / 发现边界</text>
  <text x="896" y="205" class="body">Delivery versions may differ</text>
  <text x="896" y="228" class="body">两次讲述不能假定逐字一致</text>
  <text x="896" y="253" class="small">Wording · order · examples · additions</text>
  <text x="896" y="271" class="small">措辞 · 顺序 · 例子 · 现场新增</text>

  <path d="M 1010 280 C 1010 318, 916 322, 916 352" class="arrow"/>

  <text x="54" y="358" class="stage">CURRENT CONTRACT / 当前契约</text>
  <rect x="150" y="378" width="900" height="180" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
  <text x="600" y="410" text-anchor="middle" class="card-title">Optional hybrid / 可选受控增强</text>

  <rect x="182" y="432" width="392" height="96" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="204" y="460" class="card-title">Sunday live / 周日现场</text>
  <text x="204" y="485" class="body">Live audio + current English = source of truth</text>
  <text x="204" y="508" class="body">现场音频 + 当下英文 = 唯一事实来源</text>

  <text x="600" y="482" text-anchor="middle" font-size="24" font-weight="700" fill="#059669">+</text>

  <rect x="626" y="432" width="392" height="96" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="648" y="460" class="card-title">Saturday context / 周六 context</text>
  <text x="648" y="485" class="body">Guarded structure · terms · Scripture · examples</text>
  <text x="648" y="508" class="body">默认 none；仅按门槛启用已审核资料</text>

  <path d="M 600 558 L 600 590" class="arrow"/>

  <text x="54" y="598" class="stage">FUTURE, ONLY AFTER EVIDENCE / 未来方向，必须先过证据门</text>
  <rect x="300" y="614" width="600" height="72" rx="14" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="600" y="644" text-anchor="middle" class="card-title">Domain post-training / 领域后训练</text>
  <text x="600" y="669" text-anchor="middle" class="body">Quality first · latency measured · frozen A/B + human Gold + venue gate</text>
</svg>
