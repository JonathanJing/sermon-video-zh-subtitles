<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1380" viewBox="0 0 1600 1380" role="img" aria-labelledby="title description">
<title id="title">从现场问题到受控增强</title>
<desc id="description">用当前音频决定实时内容，让已审核材料提供可选帮助。窗口审批不是同篇审批；机器中文仍为候选，不因已导出就进入实时提示词。；实验实现不代表已上线或质量提升；文档、音频发布仍须各自审核与发布后核验。</desc>
