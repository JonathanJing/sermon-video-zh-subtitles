<title id="title">从现场问题到受控增强</title><desc id="desc">用当前音频决定实时内容，让已审核材料提供可选帮助 窗口审批不是同篇审批；机器中文仍为候选，不因已导出就进入实时提示词。 实验实现不代表已上线或质量提升；文档、音频发布仍须各自审核与发布后核验。</desc>
