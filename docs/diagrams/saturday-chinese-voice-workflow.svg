<text x="60" y="39" class="eyebrow" >SERMON AUDIO / SATURDAY → SUNDAY</text>
<text x="60" y="91" class="title" >同一份英文视频，讲员原声风格的中文听译。</text>
<text x="60" y="128" class="sub" >两路并行取得来源；本对话 Astra 修订审核，周日现场同步另行验收。</text>
