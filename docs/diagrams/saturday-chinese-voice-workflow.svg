<title id="title">中文配音与每周发行</title><desc id="desc">冻结来源，逐讲员生成候选，经人工听审后核验完整发行包 训练保留 dev/test；回听与对齐仅为辅助，不能替代人听或证明现场同步已完成。 现有定时任务范围为双文档与上下文包，不能据此认定配音已自动接入；试听候选保留候选标记。</desc>
