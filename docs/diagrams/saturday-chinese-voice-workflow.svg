<text x="82" y="203" class="node-title">主路：同版本纯证道视频 · 待接入</text>
<text x="82" y="240" class="line">等待周日实际播放的文件；哈希、版本、纯证道契约</text>
<text x="82" y="272" class="line">契约成立后使用整片范围，无需人工重填起止时间</text>
<text x="82" y="316" class="model">实际视频与接入器未就绪；不计为全自动完成</text>
<rect x="830" y="162" width="710" height="183" rx="18" fill="#fff5df" stroke="#dfc98e"/>
<text x="852" y="203" class="node-title">并行 fallback：直播归档 · 当前半自动</text>
<text x="852" y="240" class="line">继续直播归档与窗口确认，主路未到不阻挡备份流程</text>
<text x="852" y="272" class="line">当前复用人工窗口；自动边界将另建模型证据契约</text>
<text x="852" y="316" class="model">周六定时任务 → PDF / QA → 配音候选 → 本对话审核</text>
<text x="60" y="381" class="model">可恢复桥接：按周和来源加锁，冻结输入，只生成变更语音段，审核记录不升级为人工 Gold。</text>
