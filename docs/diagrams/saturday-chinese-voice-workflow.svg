<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
<title id="title">周六证道流程扩展：讲员原声风格中文配音与周日同视频播放</title>
<desc id="desc">沿用授权视频、人工证道范围确认、英文参考、Astra Medium 中文审校和双 PDF；通过按讲员隔离的 Qwen3 TTS 训练生成中文，经声音与同视频同步审核，发布 Firebase 并在周日播放。</desc>
