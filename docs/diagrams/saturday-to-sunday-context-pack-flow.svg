<title id="title">周六上下文包的受控边界</title><desc id="desc">现场输入是主路；包只有在独立审核与能力许可后才提供增强 机器中文候选无直达提示词通道；ASR 短语偏置未启用或验证。已导出不等于已启用或质量提升。 无包保持录音、转写与 A0 主路；现场语义和设备验收独立进行，文件发布核验不代替现场证明。</desc>
