<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Historical cloud architecture</title>
  <desc id="desc">A historical Discovery architecture with scheduled source discovery, cloud realtime and offline processing, Firestore and GCS, API, operator PWA, and a read-only congregation view.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.bg{fill:#f8fafc}.title{font-size:29px;font-weight:700;fill:#0f172a}.sub{font-size:14px;fill:#64748b}.h{font-size:16px;font-weight:700;fill:#334155}.t{font-size:13px;fill:#64748b}.warn{fill:#fff7ed;stroke:#f97316;stroke-width:2}.box{fill:#fff;stroke:#94a3b8;stroke-width:2}.store{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}.dash{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1200" height="690" rx="24"/><text class="title" x="48" y="56">Historical cloud architecture · 历史 Discovery 架构</text><text class="sub" x="48" y="84">Retained for research context — not the current Sunday operator path.</text>
  <rect class="warn" x="48" y="112" width="1104" height="50" rx="13"/><text class="h" x="600" y="143" text-anchor="middle">Do not infer deployment, provider availability, or live readiness from this diagram.</text>
  <rect class="box" x="66" y="224" width="176" height="80" rx="14"/><text class="h" x="154" y="255" text-anchor="middle">Scheduler / admin</text><text class="t" x="154" y="279" text-anchor="middle">source discovery</text>
  <polygon class="box" points="354,214 444,264 354,314 264,264"/><text class="h" x="354" y="257" text-anchor="middle">Usable source?</text><text class="t" x="354" y="280" text-anchor="middle">or fallback</text>
  <rect class="box" x="486" y="206" width="204" height="116" rx="14"/><text class="h" x="588" y="237" text-anchor="middle">Cloud processing</text><text class="t" x="588" y="261" text-anchor="middle">realtime / offline ASR</text><text class="t" x="588" y="282" text-anchor="middle">translation + stabilization</text><text class="t" x="588" y="303" text-anchor="middle">notes / scripture / exports</text>
  <rect class="store" x="762" y="196" width="176" height="94" rx="14"/><text class="h" x="850" y="229" text-anchor="middle">Firestore</text><text class="t" x="850" y="254" text-anchor="middle">session state</text><text class="t" x="850" y="274" text-anchor="middle">published segments</text>
  <rect class="store" x="762" y="324" width="176" height="94" rx="14"/><text class="h" x="850" y="357" text-anchor="middle">GCS</text><text class="t" x="850" y="382" text-anchor="middle">durable artifacts</text><text class="t" x="850" y="402" text-anchor="middle">reports / exports</text>
  <rect class="box" x="994" y="260" width="158" height="94" rx="14"/><text class="h" x="1073" y="293" text-anchor="middle">Cloud Run API</text><text class="t" x="1073" y="318" text-anchor="middle">read / publish</text><text class="t" x="1073" y="338" text-anchor="middle">operator auth</text>
  <path class="line" d="M242 264H260"/><path class="line" d="M448 264H482"/><path class="line" d="M690 247H758"/><path class="line" d="M690 282C726 282 726 371 758 371"/><path class="line" d="M938 243C970 243 970 287 990 287"/><path class="line" d="M938 371C970 371 970 327 990 327"/>
  <rect class="box" x="684" y="514" width="200" height="86" rx="14"/><text class="h" x="784" y="547" text-anchor="middle">Operator PWA</text><text class="t" x="784" y="572" text-anchor="middle">review and publish controls</text>
  <rect class="box" x="934" y="514" width="218" height="86" rx="14"/><text class="h" x="1043" y="547" text-anchor="middle">Congregation view</text><text class="t" x="1043" y="572" text-anchor="middle">read-only published slice</text>
  <path class="dash" d="M1073 354V474H784V510"/><path class="dash" d="M1073 354V510"/>
  <rect fill="#e2e8f0" x="48" y="638" width="1104" height="34" rx="11"/><text class="t" x="600" y="660" text-anchor="middle">Current operator truth lives in docs/workflows/README.zh.md and experiments/local-live-poc/README.md</text>
</svg>
