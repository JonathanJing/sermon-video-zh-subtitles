<text x="494" y="191" class="body" text-anchor="start">REST :8766 / WebSocket :8767</text>
<text x="494" y="217" class="body" text-anchor="start">100 ms PCM → VAD (500 ms / 3 s)</text>
<text x="494" y="243" class="body" text-anchor="start">ASR queue 2 / translation queue 1</text>
<text x="494" y="269" class="body" text-anchor="start">Immutable final → lexical guard</text>
<text x="494" y="295" class="body" text-anchor="start">legacy translation / readable_chunks</text>
