<text x="64" y="191" class="body" text-anchor="start">Microphone → two audio paths</text>
<text x="64" y="217" class="body" text-anchor="start">MediaRecorder → recovery chunks</text>
<text x="64" y="243" class="body" text-anchor="start">AudioWorklet → 16 kHz PCM</text>
<text x="64" y="269" class="body" text-anchor="start">Current + previous bilingual pair</text>
