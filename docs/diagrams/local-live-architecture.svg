<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1710" viewBox="0 0 1600 1710" role="img" aria-labelledby="title desc">
<title id="title">本地推理与只读分发</title><desc id="desc">浏览器经网关访问模型；录音独立，实验分支仅允许本机使用 私有音频与控制接口不对公网开放；公网分发是有界尽力发送，不是持久发件箱，发布后仍须核验。 模型失败仍保留录音；重连会记录缺口，不保证字幕无损。实验未通过神学及现场门，不能升级默认。</desc>
