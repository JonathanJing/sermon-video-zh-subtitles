<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Local live-caption runtime architecture</title>
  <desc id="desc">A browser operator UI communicates with a localhost gateway using REST and WebSocket. The gateway coordinates session storage, local ASR, MiLMMT through Ollama, content packs, and a tokenized read-only SSE viewer.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.bg{fill:#f8fafc}.title{font-size:29px;font-weight:700;fill:#0f172a}.sub{font-size:14px;fill:#64748b}.h{font-size:17px;font-weight:700;fill:#0f172a}.t{font-size:14px;fill:#334155}.lane{fill:#fff;stroke:#cbd5e1;stroke-width:2}.ui{fill:#ecfdf5;stroke:#10b981;stroke-width:2}.gw{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.model{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.data{fill:#fff7ed;stroke:#f97316;stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:2.2;marker-end:url(#a)}.bi{fill:none;stroke:#2563eb;stroke-width:2.2;marker-start:url(#a);marker-end:url(#a)}.dash{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1200" height="720" rx="24"/><text class="title" x="48" y="56">Local runtime architecture · 本地实时字幕架构</text><text class="sub" x="48" y="84">Control, live data, durable evidence, and read-only distribution have separate contracts.</text>
  <rect class="lane" x="44" y="112" width="236" height="540" rx="20"/><text class="h" x="162" y="145" text-anchor="middle">User surfaces</text>
  <rect class="ui" x="74" y="184" width="176" height="106" rx="15"/><text class="h" x="162" y="217" text-anchor="middle">Operator browser</text><text class="sub" x="162" y="242" text-anchor="middle">mic · controls · captions</text><text class="sub" x="162" y="264" text-anchor="middle">localhost only</text>
  <rect class="ui" x="74" y="420" width="176" height="106" rx="15"/><text class="h" x="162" y="453" text-anchor="middle">Phone viewer</text><text class="sub" x="162" y="478" text-anchor="middle">random token · SSE</text><text class="sub" x="162" y="500" text-anchor="middle">read-only on LAN</text>

  <rect class="lane" x="324" y="112" width="300" height="540" rx="20"/><text class="h" x="474" y="145" text-anchor="middle">Local Gateway</text>
  <rect class="gw" x="354" y="176" width="240" height="88" rx="15"/><text class="h" x="474" y="207" text-anchor="middle">REST control plane</text><text class="sub" x="474" y="232" text-anchor="middle">start · recovery chunks · stop</text>
  <rect class="gw" x="354" y="300" width="240" height="88" rx="15"/><text class="h" x="474" y="331" text-anchor="middle">WebSocket data plane</text><text class="sub" x="474" y="356" text-anchor="middle">PCM ↔ caption/status events</text>
  <rect class="gw" x="354" y="424" width="240" height="112" rx="15"/><text class="h" x="474" y="455" text-anchor="middle">Pipeline coordinator</text><text class="sub" x="474" y="480" text-anchor="middle">VAD · queues · dedupe</text><text class="sub" x="474" y="502" text-anchor="middle">context policy · fallbacks</text>
  <path class="bi" d="M250 220H350"/><text class="sub" x="300" y="207" text-anchor="middle">REST</text><path class="bi" d="M250 237H300V344H350"/><text class="sub" x="315" y="331" text-anchor="middle">WS</text><path class="line" d="M354 473H254"/><text class="sub" x="304" y="461" text-anchor="middle">SSE</text>

  <rect class="lane" x="668" y="112" width="488" height="540" rx="20"/><text class="h" x="912" y="145" text-anchor="middle">Providers and evidence</text>
  <rect class="model" x="704" y="184" width="188" height="94" rx="15"/><text class="h" x="798" y="214" text-anchor="middle">Local ASR</text><text class="sub" x="798" y="239" text-anchor="middle">Qwen3-ASR MLX</text><text class="sub" x="798" y="260" text-anchor="middle">Whisper fallback</text>
  <rect class="model" x="932" y="184" width="188" height="94" rx="15"/><text class="h" x="1026" y="214" text-anchor="middle">Translation</text><text class="sub" x="1026" y="239" text-anchor="middle">Ollama + MiLMMT Q8</text><text class="sub" x="1026" y="260" text-anchor="middle">NDJSON tokens</text>
  <rect class="data" x="704" y="342" width="188" height="94" rx="15"/><text class="h" x="798" y="372" text-anchor="middle">Weekly pack</text><text class="sub" x="798" y="397" text-anchor="middle">approved terms only</text><text class="sub" x="798" y="418" text-anchor="middle">A0 none remains</text>
  <rect class="data" x="932" y="342" width="188" height="94" rx="15"/><text class="h" x="1026" y="372" text-anchor="middle">Session storage</text><text class="sub" x="1026" y="397" text-anchor="middle">audio · events · manifest</text><text class="sub" x="1026" y="418" text-anchor="middle">SHA-256 + recovery</text>
  <rect class="data" x="818" y="500" width="188" height="94" rx="15"/><text class="h" x="912" y="530" text-anchor="middle">Replay / A-B</text><text class="sub" x="912" y="555" text-anchor="middle">frozen ASR finals</text><text class="sub" x="912" y="576" text-anchor="middle">blind review + hashes</text>
  <path class="bi" d="M594 344C642 344 642 231 700 231"/><path class="bi" d="M892 231H928"/><path class="dash" d="M704 389H640V450H598"/><path class="line" d="M594 480H660V460H1026V440"/><path class="line" d="M1026 436C1026 470 912 466 912 496"/>
  <text class="sub" x="658" y="245">audio / final</text><text class="sub" x="910" y="218" text-anchor="middle">English</text>
</svg>
