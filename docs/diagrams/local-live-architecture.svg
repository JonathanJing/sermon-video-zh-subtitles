<text x="64" y="796" class="body" text-anchor="start">Read-only :8780 / SSE</text>
<text x="64" y="822" class="body" text-anchor="start">Random session token</text>
<text x="64" y="848" class="body" text-anchor="start">Portrait + landscape fitting</text>
