<text x="64" y="498" class="head" text-anchor="start">Independent recovery · 录音</text>
<text x="64" y="528" class="body" text-anchor="start">Chunks + PCM + events on disk</text>
<text x="64" y="554" class="body" text-anchor="start">Browser Blob fallback retained</text>
<text x="64" y="580" class="body" text-anchor="start">Finalize: latest connection drain</text>
<text x="64" y="606" class="body" text-anchor="start">Hash + WAV + atomic manifest</text>
<path d="M520 348V435H214V465" class="edge"/>
<text x="393" y="424" class="note" text-anchor="middle">Gateway writes; browser does not write server disk</text>
<rect x="474" y="465" width="435" height="170" rx="14" fill="#edf4ff" stroke="#86abe6" stroke-width="1.5"/>
<text x="494" y="498" class="head" text-anchor="start">Recovery + identity · 恢复与版本</text>
<text x="494" y="528" class="body" text-anchor="start">Same session / durable seq / viewer token</text>
<text x="494" y="554" class="body" text-anchor="start">Explicit PCM gaps and caption interruption</text>
<text x="494" y="580" class="body" text-anchor="start">Git + model + prompt + config hashes</text>
<text x="494" y="606" class="body" text-anchor="start">No automatic in-flight ASR reconstruction</text>
<path d="M690 348V465" class="edge"/>
<rect x="999" y="465" width="357" height="170" rx="14" fill="#fff5e9" stroke="#e1aa68" stroke-width="1.5"/>
