<text x="1019" y="528" class="body" text-anchor="start">Export + readiness implemented</text>
<text x="1019" y="554" class="body" text-anchor="start">Human identity / review gates</text>
<text x="1019" y="580" class="body" text-anchor="start">Capability ceiling; fail down</text>
<text x="1019" y="606" class="body" text-anchor="start">No machine Chinese injection</text>
