<text x="494" y="796" class="body" text-anchor="start">Bounded latest-snapshot queue (32)</text>
<text x="494" y="822" class="body" text-anchor="start">Nonblocking local caption path</text>
<text x="494" y="848" class="body" text-anchor="start">Best effort; no durable outbox</text>
<rect x="999" y="733" width="357" height="140" rx="14" fill="#eaf8f1" stroke="#70b897" stroke-width="1.5"/>
<text x="1019" y="766" class="head" text-anchor="start">Firebase public viewer</text>
<text x="1019" y="796" class="body" text-anchor="start">HTTPS Hosting + Realtime DB</text>
<text x="1019" y="822" class="body" text-anchor="start">Read-only captions / reconnect</text>
<text x="1019" y="848" class="body" text-anchor="start">No audio or control endpoint</text>
