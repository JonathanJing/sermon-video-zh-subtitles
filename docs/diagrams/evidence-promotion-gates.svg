<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Evidence and model promotion gates</title>
  <desc id="desc">Evidence progresses from engineering smoke to model-reviewed reference, human Gold, frozen replay, browser WAV soak, venue rehearsal, and production promotion, while failures return to Discovery.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.bg{fill:#f8fafc}.title{font-size:29px;font-weight:700;fill:#0f172a}.sub{font-size:14px;fill:#64748b}.h{font-size:15px;font-weight:700;fill:#0f172a}.t{font-size:13px;fill:#475569}.done{fill:#ecfdf5;stroke:#10b981;stroke-width:2}.partial{fill:#fff7ed;stroke:#f97316;stroke-width:2}.pending{fill:#fff;stroke:#94a3b8;stroke-width:2}.prod{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:2.2;marker-end:url(#a)}.return{fill:none;stroke:#e11d48;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1200" height="680" rx="24"/><text class="title" x="48" y="56">Evidence ladder · 模型与工作流晋级门槛</text><text class="sub" x="48" y="84">A passing engineering test is not human quality evidence, and a local soak is not venue acceptance.</text>
  <rect class="done" x="48" y="150" width="152" height="92" rx="15"/><text class="h" x="124" y="181" text-anchor="middle">Engineering smoke</text><text class="t" x="124" y="205" text-anchor="middle">decode · protocol</text><text class="t" x="124" y="224" text-anchor="middle">failure handling</text>
  <rect class="done" x="238" y="150" width="152" height="92" rx="15"/><text class="h" x="314" y="181" text-anchor="middle">Reviewed reference</text><text class="t" x="314" y="205" text-anchor="middle">provisional ranking</text><text class="t" x="314" y="224" text-anchor="middle">not human Gold</text>
  <rect class="partial" x="428" y="150" width="152" height="92" rx="15"/><text class="h" x="504" y="181" text-anchor="middle">Human Gold</text><text class="t" x="504" y="205" text-anchor="middle">word-level review</text><text class="t" x="504" y="224" text-anchor="middle">currently pending</text>
  <rect class="done" x="618" y="150" width="152" height="92" rx="15"/><text class="h" x="694" y="181" text-anchor="middle">Frozen replay</text><text class="t" x="694" y="205" text-anchor="middle">same inputs</text><text class="t" x="694" y="224" text-anchor="middle">hash provenance</text>
  <rect class="done" x="808" y="150" width="152" height="92" rx="15"/><text class="h" x="884" y="181" text-anchor="middle">Browser WAV soak</text><text class="t" x="884" y="205" text-anchor="middle">Qwen + MiLMMT</text><text class="t" x="884" y="224" text-anchor="middle">20 min × 3 loops</text>
  <rect class="partial" x="998" y="150" width="152" height="92" rx="15"/><text class="h" x="1074" y="181" text-anchor="middle">Venue rehearsal</text><text class="t" x="1074" y="205" text-anchor="middle">audio · real phones</text><text class="t" x="1074" y="224" text-anchor="middle">currently pending</text>
  <path class="line" d="M200 196H234"/><path class="line" d="M390 196H424"/><path class="line" d="M580 196H614"/><path class="line" d="M770 196H804"/><path class="line" d="M960 196H994"/>
  <rect class="prod" x="450" y="350" width="300" height="94" rx="17"/><text class="h" x="600" y="382" text-anchor="middle">Production promotion</text><text class="t" x="600" y="407" text-anchor="middle">all required gates + fresh evidence</text><text class="t" x="600" y="427" text-anchor="middle">explicit operator decision</text>
  <path class="line" d="M1074 242V294H600V346"/>
  <rect class="pending" x="242" y="528" width="716" height="86" rx="17"/><text class="h" x="600" y="559" text-anchor="middle">Discovery / iterate without upgrading the claim</text><text class="t" x="600" y="583" text-anchor="middle">alternate models · VAD tuning · post-training · cloud experiments · failed gates</text>
  <path class="return" d="M504 246V316H412V500H438V524"/><path class="return" d="M1074 246V500H762V524"/><path class="return" d="M450 397H384V524"/>
  <rect fill="#e2e8f0" x="230" y="640" width="740" height="28" rx="10"/><text class="t" x="600" y="659" text-anchor="middle">Current: real-model delivery verified; human quality, field devices and memory bounds remain unverified.</text>
</svg>
