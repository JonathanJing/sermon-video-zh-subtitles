<title id="title">证据积累与晋级门槛</title><desc id="desc">证据可以并行积累；全部适用门槛汇合通过后才能晋级 文档质检、声音听审、现场语义各有门槛；回归测试数量、机器审核或浏览器回放均不能替代人审与现场。 使用授权媒体，原文与审批受控保存；未完成的人审、现场及多场资源门保持待验，不因重绘改为通过。</desc>
