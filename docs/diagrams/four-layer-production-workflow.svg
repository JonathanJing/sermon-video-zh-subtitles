<text x="1217" y="778" font-size="15" font-weight="430" fill="#304951" text-anchor="start" >• 内容发布不需要生成式模型</text>
<text x="1217" y="802" font-size="15" font-weight="430" fill="#304951" text-anchor="start" >• Firebase + Web / iOS validators</text>
<text x="1217" y="826" font-size="15" font-weight="430" fill="#304951" text-anchor="start" >• GPT-6 Astra Supervisor 只负责编排</text>
