<text x="480.5" y="291" font-size="22" font-weight="750" fill="#7460b7" text-anchor="middle" >2</text>
<text x="515" y="290" font-size="16" font-weight="750" fill="#7460b7" text-anchor="start" >LAYER 2</text>
<text x="460" y="338" font-size="25" font-weight="700" fill="#17314e" text-anchor="start" >目标语言文字</text>
<text x="460" y="377" font-size="13" font-weight="400" fill="#71879b" text-anchor="start" >Target-Language Text</text>
<rect x="454" y="390" width="318" height="124" rx="13" fill="#f0edfa" stroke="none" />
<text x="468" y="416" font-size="14" font-weight="750" fill="#7460b7" text-anchor="start" >输入 / INPUT</text>
<text x="468" y="443" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• Layer 1 package + targetLocale</text>
<text x="468" y="466" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 翻译策略、术语表与 CUV 规则</text>
<rect x="454" y="526" width="318" height="190" rx="13" fill="#f0edfa" stroke="none" />
<text x="468" y="552" font-size="14" font-weight="750" fill="#7460b7" text-anchor="start" >流程 / PROCESS</text>
<text x="468" y="579" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 按 sourceUnitId 从英文直译</text>
<text x="468" y="602" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 不同 request 独立语义复核</text>
<text x="468" y="625" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 检查否定、因果、经文、专名和数字</text>
<rect x="454" y="728" width="318" height="194" rx="13" fill="#f0edfa" stroke="none" />
<text x="468" y="754" font-size="14" font-weight="750" fill="#7460b7" text-anchor="start" >模型与工具 / MODELS + TOOLS</text>
<text x="468" y="781" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 片段策略：Astra 初译 / Sol 逐组复核</text>
<text x="468" y="804" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• ko / es 片段已审；正式周次待验</text>
<text x="468" y="827" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 固定 CUV 库：确定性精确取文</text>
<rect x="454" y="934" width="318" height="155" rx="13" fill="#f0edfa" stroke="none" />
<text x="468" y="960" font-size="14" font-weight="750" fill="#7460b7" text-anchor="start" >输出与门槛 / OUTPUT + GATE</text>
<text x="468" y="987" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• Target-Language Candidate</text>
<text x="468" y="1010" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 门禁：human_translation_approved</text>
<text x="468" y="1033" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 每个 locale 独立文件与审核</text>
<rect x="812" y="238" width="350" height="876" rx="22" fill="#ffffff" stroke="#d4e0ea" filter="url(#card-shadow)"/>
<rect x="812" y="238" width="350" height="10" rx="4" fill="#c68224" stroke="none" />
<rect x="833" y="262" width="43" height="43" rx="21" fill="#fff3e4" stroke="none" />
<text x="854.5" y="291" font-size="22" font-weight="750" fill="#c68224" text-anchor="middle" >3</text>
<text x="889" y="290" font-size="16" font-weight="750" fill="#c68224" text-anchor="start" >LAYER 3</text>
<text x="834" y="338" font-size="25" font-weight="700" fill="#17314e" text-anchor="start" >目标语言音频与同步</text>
<text x="834" y="377" font-size="13" font-weight="400" fill="#71879b" text-anchor="start" >Target-Language Audio &amp; Synchronization</text>
<rect x="828" y="390" width="318" height="124" rx="13" fill="#fff3e4" stroke="none" />
<text x="842" y="416" font-size="14" font-weight="750" fill="#c68224" text-anchor="start" >输入 / INPUT</text>
<text x="842" y="443" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 已批准 Candidate + Layer 1 锚点</text>
<text x="842" y="466" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 同 locale 授权声音 / checkpoint</text>
<rect x="828" y="526" width="318" height="190" rx="13" fill="#fff3e4" stroke="none" />
<text x="842" y="552" font-size="14" font-weight="750" fill="#c68224" text-anchor="start" >流程 / PROCESS</text>
<text x="842" y="579" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 自然语速逐单元 TTS</text>
<text x="842" y="602" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 实测时长 → 滚动排程与字幕</text>
<text x="842" y="625" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 机器回转写筛查 + 全文人工听审</text>
<rect x="828" y="728" width="318" height="194" rx="13" fill="#fff3e4" stroke="none" />
<text x="842" y="754" font-size="14" font-weight="750" fill="#c68224" text-anchor="start" >模型与工具 / MODELS + TOOLS</text>
<text x="842" y="781" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• Qwen3-TTS：当前中文语音 adapter</text>
<text x="842" y="804" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• Qwen3-ASR：回转写筛查，不是批准</text>
<text x="842" y="827" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 确定性 scheduler + FFmpeg</text>
<text x="842" y="850" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• ko / es 配音：Dev 片段已听审</text>
<rect x="828" y="934" width="318" height="155" rx="13" fill="#fff3e4" stroke="none" />
<text x="842" y="960" font-size="14" font-weight="750" fill="#c68224" text-anchor="start" >输出与门槛 / OUTPUT + GATE</text>
<text x="842" y="987" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• Target-Language Audio Package</text>
<text x="842" y="1010" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 门禁：human_reviewed / audio_unavailable</text>
<text x="842" y="1033" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 禁止删义、自动加速、拉伸或裁切</text>
<rect x="1186" y="238" width="350" height="876" rx="22" fill="#ffffff" stroke="#d4e0ea" filter="url(#card-shadow)"/>
<rect x="1186" y="238" width="350" height="10" rx="4" fill="#198665" stroke="none" />
