<text x="64" y="65" font-size="18" font-weight="700" fill="#51749a" text-anchor="start" letter-spacing="2">SERMON WORKFLOWS  /  FOUR-LAYER MULTILINGUAL PRODUCTION</text>
<text x="64" y="127" font-size="44" font-weight="750" fill="#17314e" text-anchor="start" >四层多语言生产</text>
<text x="65" y="170" font-size="21" font-weight="400" fill="#5b748e" text-anchor="start" >英文事实只冻结一次；每种目标语言分别完成文字、音频与发布门禁</text>
<rect x="1398" y="44" width="138" height="42" rx="21" fill="#ffffff" stroke="#d3e0eb" />
<text x="1467" y="72" font-size="16" font-weight="650" fill="#6a8198" text-anchor="middle" >README 图</text>
