<text x="141" y="290" font-size="16" font-weight="750" fill="#326fb4" text-anchor="start" >LAYER 1</text>
<text x="86" y="338" font-size="25" font-weight="700" fill="#17314e" text-anchor="start" >共享英文事实与锚点</text>
<text x="86" y="377" font-size="13" font-weight="400" fill="#71879b" text-anchor="start" >Shared English Source &amp; Anchors</text>
<rect x="80" y="390" width="318" height="124" rx="13" fill="#eaf2fc" stroke="none" />
<text x="94" y="416" font-size="14" font-weight="750" fill="#326fb4" text-anchor="start" >输入 / INPUT</text>
<text x="94" y="443" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 授权媒体 + 人工批准范围</text>
<text x="94" y="466" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 冻结英文 / 可信原稿</text>
<rect x="80" y="526" width="318" height="190" rx="13" fill="#eaf2fc" stroke="none" />
<text x="94" y="552" font-size="14" font-weight="750" fill="#326fb4" text-anchor="start" >流程 / PROCESS</text>
<text x="94" y="579" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 完整转写 → 词级声学对齐</text>
<text x="94" y="602" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 句、分句、标点、停顿锚定</text>
<text x="94" y="625" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 来源、覆盖率与 hash 冻结</text>
<rect x="80" y="728" width="318" height="194" rx="13" fill="#eaf2fc" stroke="none" />
<text x="94" y="754" font-size="14" font-weight="750" fill="#326fb4" text-anchor="start" >模型与工具 / MODELS + TOOLS</text>
<text x="94" y="781" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• gpt-transcribe：英文 ASR</text>
<text x="94" y="804" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• MFA / Qwen3-ForcedAligner：词时轴</text>
<text x="94" y="827" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• GPT-6 Astra：文字、标点与断句审核</text>
<text x="94" y="850" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 模型不得伪造声学时间戳</text>
<rect x="80" y="934" width="318" height="155" rx="13" fill="#eaf2fc" stroke="none" />
<text x="94" y="960" font-size="14" font-weight="750" fill="#326fb4" text-anchor="start" >输出与门槛 / OUTPUT + GATE</text>
<text x="94" y="987" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• English Source Package</text>
<text x="94" y="1010" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 门禁：ready_for_translation</text>
<text x="94" y="1033" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 完整性、对齐和句界人工审核</text>
<rect x="438" y="238" width="350" height="876" rx="22" fill="#ffffff" stroke="#d4e0ea" filter="url(#card-shadow)"/>
<rect x="438" y="238" width="350" height="10" rx="4" fill="#7460b7" stroke="none" />
