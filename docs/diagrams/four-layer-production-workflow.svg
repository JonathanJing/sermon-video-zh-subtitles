<text x="1217" y="606" font-size="15" font-weight="430" fill="#304951" text-anchor="start" >• 部署后核验 hash、HTTP 与 Range</text>
<text x="1217" y="630" font-size="15" font-weight="430" fill="#304951" text-anchor="start" >• Web、iOS、设备与现场分别验收</text>
