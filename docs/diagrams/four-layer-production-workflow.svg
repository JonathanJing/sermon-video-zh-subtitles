<text x="87" y="1331" font-size="19" font-weight="700" fill="#966820" text-anchor="start" >独立旁路：Sunday live / live_session</text>
<text x="87" y="1364" font-size="17" font-weight="400" fill="#697687" text-anchor="start" >会后录音若要持久发布，重新从 Layer 1 开始。</text>
<rect x="816" y="1296" width="720" height="92" rx="17" fill="#f0edfa" stroke="#d2c9e7" />
<text x="839" y="1331" font-size="19" font-weight="700" fill="#6d5aa9" text-anchor="start" >跨层编排：Supervisor + 确定性工具</text>
<text x="839" y="1364" font-size="17" font-weight="400" fill="#697687" text-anchor="start" >Agent 不自授人工批准；legacy complete 不等于四层发布。</text>
<rect x="64" y="1448" width="1472" height="96" rx="20" fill="#1d4061" stroke="none" />
<text x="88" y="1479" font-size="18" font-weight="500" fill="#e7f1f8" text-anchor="start" >两段三语 Dev 片段已审；正式站仍九周中文。通用 Layer 2–4 producer 持续迁移，legacy complete 不等于四层发布。</text>
<text x="88" y="1506" font-size="18" font-weight="500" fill="#e7f1f8" text-anchor="start" >模型是各层工具，不是事实或人工批准来源；来源、hash、覆盖率、语义、听审与播放证据分别留存。</text>
