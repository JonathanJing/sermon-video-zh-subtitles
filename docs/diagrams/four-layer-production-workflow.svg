<text x="1263" y="290" font-size="16" font-weight="750" fill="#198665" text-anchor="start" >LAYER 4</text>
<text x="1208" y="338" font-size="25" font-weight="700" fill="#17314e" text-anchor="start" >多语言发布与播放</text>
<text x="1208" y="377" font-size="13" font-weight="400" fill="#71879b" text-anchor="start" >Multilingual Delivery &amp; Playback</text>
<rect x="1202" y="390" width="318" height="124" rx="13" fill="#e7f7ee" stroke="none" />
<text x="1216" y="416" font-size="14" font-weight="750" fill="#198665" text-anchor="start" >输入 / INPUT</text>
<text x="1216" y="443" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 同 locale 文字包 + 音频包</text>
<text x="1216" y="466" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 页面来源身份与显式资产清单</text>
<rect x="1202" y="526" width="318" height="190" rx="13" fill="#e7f7ee" stroke="none" />
<text x="1216" y="552" font-size="14" font-weight="750" fill="#198665" text-anchor="start" >流程 / PROCESS</text>
<text x="1216" y="579" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 构建页面 / catalog / allowlist</text>
<text x="1216" y="602" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 部署后核验 hash、HTTP 与 Range</text>
<text x="1216" y="625" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• Web、iOS、设备与现场分别验收</text>
<rect x="1202" y="728" width="318" height="194" rx="13" fill="#e7f7ee" stroke="none" />
<text x="1216" y="754" font-size="14" font-weight="750" fill="#198665" text-anchor="start" >模型与工具 / MODELS + TOOLS</text>
<text x="1216" y="781" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 内容发布不需要生成式模型</text>
<text x="1216" y="804" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• Firebase + Web / iOS validators</text>
<text x="1216" y="827" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• GPT-6 Astra Supervisor 只负责编排</text>
<text x="1216" y="850" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• ImageGen 仅用于可选海报主视觉</text>
<rect x="1202" y="934" width="318" height="155" rx="13" fill="#e7f7ee" stroke="none" />
<text x="1216" y="960" font-size="14" font-weight="750" fill="#198665" text-anchor="start" >输出与门槛 / OUTPUT + GATE</text>
<text x="1216" y="987" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• Target-Language Release Package</text>
<text x="1216" y="1010" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• HTTP / device / venue 状态分开</text>
<text x="1216" y="1033" font-size="16" font-weight="400" fill="#35516a" text-anchor="start" >• 下游不得补译或提升上游审核</text>
