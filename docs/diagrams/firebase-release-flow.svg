<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
  <title id="title">四层内容、Dev 审核与 Firebase 正式发布</title>
  <desc id="desc">获准来源经四层按语言审核进入 Dev；代码由 dev 经检查晋升 main，内容则依独立发布计划部署并做 HTTP 校验。正式站目前只有九个旧中文周次，两段三语片段只在 Dev。设备和现场验收另行记录。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 8 4.5 1 8" fill="none" stroke="#405D64" stroke-width="1.8"/></marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; }
    .title { fill:#19343D; font-size:36px; font-weight:700; }
    .sub { fill:#526A70; font-size:18px; }
    .lane { fill:#405D64; font-size:18px; font-weight:700; }
    .head { fill:#17343D; font-size:20px; font-weight:700; }
    .body { fill:#415B61; font-size:16px; }
    .note { fill:#38565E; font-size:17px; font-weight:600; }
  </style>
  <rect width="1440" height="850" fill="#F5F7F4"/>
  <rect x="48" y="46" width="42" height="6" rx="3" fill="#267D72"/>
  <text x="102" y="57" fill="#64787A" font-size="16" font-weight="700" letter-spacing="2">CONTENT · CODE · DEPLOYMENT</text>
  <text x="48" y="111" class="title">从四层生产到 Firebase 正式发布</text>
  <text x="48" y="147" class="sub">各层批准、代码合并、线上文件核验和现场验收分别留证</text>

  <text x="48" y="204" class="lane">内容生产与审核</text>
  <rect x="48" y="220" width="250" height="144" rx="16" fill="#E7F1FA" stroke="#9CBBDD"/>
  <text x="68" y="253" class="head">Layer 1 · 共享英文</text>
  <text x="68" y="285" class="body">授权来源与人工片段范围</text>
  <text x="68" y="311" class="body">文字、词时轴、句界与停顿</text>
  <text x="68" y="337" class="body">冻结 source hash 与锚点</text>
  <path d="M300 292 H321" stroke="#405D64" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="326" y="220" width="250" height="144" rx="16" fill="#F0EAF8" stroke="#BCA6D8"/>
  <text x="346" y="253" class="head">Layer 2 · 各语言文字</text>
  <text x="346" y="285" class="body">从英文直译、独立复核</text>
  <text x="346" y="311" class="body">中文／韩语／西语各自批准</text>
  <text x="346" y="337" class="body">每语言独立 revision</text>
  <path d="M578 292 H599" stroke="#405D64" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="604" y="220" width="250" height="144" rx="16" fill="#FFF0DF" stroke="#D7B187"/>
  <text x="624" y="253" class="head">Layer 3 · 音频与同步</text>
  <text x="624" y="285" class="body">授权声音、实测时长</text>
  <text x="624" y="311" class="body">回转写筛查与全文听审</text>
  <text x="624" y="337" class="body">字幕／音频按语言绑定</text>
  <path d="M856 292 H877" stroke="#405D64" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="882" y="220" width="250" height="144" rx="16" fill="#E3F2E9" stroke="#99C6A9"/>
  <text x="902" y="253" class="head">Layer 4 · 发布候选</text>
  <text x="902" y="285" class="body">页面、目录、视频与音频</text>
  <text x="902" y="311" class="body">按 pageId + locale 核验</text>
  <text x="902" y="337" class="body">Dev 浏览器播放与下载</text>
  <path d="M1134 292 H1155" stroke="#405D64" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="1160" y="220" width="232" height="144" rx="16" fill="#FFFFFF" stroke="#79A5A2" stroke-width="2"/>
  <text x="1180" y="253" class="head">Firebase Dev</text>
  <text x="1180" y="285" class="body">已审片段预览与验证</text>
  <text x="1180" y="311" class="body">两段三语 POC 在此</text>
  <text x="1180" y="337" class="body">不自动进入正式站</text>

  <path d="M48 398 H1392" stroke="#D3DDD8" stroke-width="2"/>
  <text x="48" y="448" class="lane">代码晋升</text>
  <rect x="48" y="468" width="586" height="89" rx="15" fill="#FFFFFF" stroke="#B7CCC7"/>
  <text x="68" y="500" class="head">dev → PR / required checks → main</text>
  <text x="68" y="530" class="body">main 合并后再通过 sync PR 回同步 dev</text>
  <text x="674" y="501" class="note">合并代码 ≠ 发布内容</text>
  <text x="674" y="531" class="body">新周次仍须单独批准发布计划和资产</text>

  <text x="48" y="610" class="lane">正式内容发布</text>
  <rect x="48" y="630" width="324" height="110" rx="15" fill="#EAF2EF" stroke="#A8C3B6"/>
  <text x="68" y="663" class="head">本次范围：旧九周中文</text>
  <text x="68" y="695" class="body">界面 zh / en / ko / es 可切换</text>
  <text x="68" y="721" class="body">未发布内容语言禁用</text>
  <path d="M375 685 H420" stroke="#405D64" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="426" y="630" width="326" height="110" rx="15" fill="#FFFFFF" stroke="#A8C3B6"/>
  <text x="446" y="663" class="head">main 构建 + 发布计划</text>
  <text x="446" y="695" class="body">Firebase Production 部署</text>
  <text x="446" y="721" class="body">保留已有媒体与历史入口</text>
  <path d="M755 685 H800" stroke="#405D64" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="806" y="630" width="326" height="110" rx="15" fill="#FFFFFF" stroke="#A8C3B6"/>
  <text x="826" y="663" class="head">线上 HTTP / SHA / Range</text>
  <text x="826" y="695" class="body">目录、深链、音频、下载验证</text>
  <text x="826" y="721" class="body">记录 release 与部署收据</text>
  <path d="M1135 685 H1176" stroke="#405D64" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <rect x="1182" y="630" width="210" height="110" rx="15" fill="#FDF1E9" stroke="#D4AD98"/>
  <text x="1202" y="663" class="head">另行验收</text>
  <text x="1202" y="695" class="body">实体设备 / 现场</text>
  <text x="1202" y="721" class="body">当前未运行</text>
  <text x="48" y="804" fill="#64787A" font-size="16">状态：2026-09-25 · 正式站仅旧中文周次 · Dev 三语片段不在正式目录 · 实线为已执行路径，虚线为独立待验收</text>
</svg>
