<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Saturday post-live dual-PDF workflow</title>
  <desc id="desc">A gated workflow from an authorized public archive through source validation, human sermon-window approval, transcription, reading review, dual PDF rendering, and QA.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.bg{fill:#f8fafc}.title{font-size:29px;font-weight:700;fill:#0f172a}.sub{font-size:14px;fill:#64748b}.h{font-size:16px;font-weight:700;fill:#0f172a}.t{font-size:14px;fill:#334155}.box{fill:#fff;stroke:#60a5fa;stroke-width:2}.human{fill:#fff7ed;stroke:#f97316;stroke-width:2}.gate{fill:#fefce8;stroke:#ca8a04;stroke-width:2}.ok{fill:#ecfdf5;stroke:#10b981;stroke-width:2}.fail{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:2.2;marker-end:url(#a)}.dash{fill:none;stroke:#e11d48;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1200" height="700" rx="24"/><text class="title" x="48" y="56">Saturday post-live production · 周六双 PDF 流程</text><text class="sub" x="48" y="84">Every decision fails closed; operator approval is evidence, not a model suggestion.</text>
  <rect class="box" x="48" y="126" width="172" height="78" rx="14"/><text class="h" x="134" y="158" text-anchor="middle">Authorized URL</text><text class="sub" x="134" y="181" text-anchor="middle">public / permitted</text>
  <rect class="box" x="260" y="126" width="172" height="78" rx="14"/><text class="h" x="346" y="158" text-anchor="middle">Archive media</text><text class="sub" x="346" y="181" text-anchor="middle">download + ffprobe</text>
  <polygon class="gate" points="540,118 632,165 540,212 448,165"/><text class="h" x="540" y="158" text-anchor="middle">Complete?</text><text class="sub" x="540" y="180" text-anchor="middle">hash + duration</text>
  <rect class="human" x="672" y="126" width="198" height="78" rx="14"/><text class="h" x="771" y="154" text-anchor="middle">Human window approval</text><text class="sub" x="771" y="178" text-anchor="middle">absolute start / end</text>
  <rect class="box" x="910" y="126" width="242" height="78" rx="14"/><text class="h" x="1031" y="154" text-anchor="middle">Sermon-only English</text><text class="sub" x="1031" y="178" text-anchor="middle">clip + gpt-transcribe reference</text>
  <path class="line" d="M220 165H256"/><path class="line" d="M432 165H444"/><path class="line" d="M636 165H668"/><path class="line" d="M870 165H906"/>

  <rect class="box" x="910" y="288" width="242" height="82" rx="14"/><text class="h" x="1031" y="319" text-anchor="middle">Chinese reading edit</text><text class="sub" x="1031" y="344" text-anchor="middle">translation + two-pass review</text>
  <polygon class="gate" points="771,280 870,329 771,378 672,329"/><text class="h" x="771" y="322" text-anchor="middle">Reading QA?</text><text class="sub" x="771" y="344" text-anchor="middle">must pass</text>
  <rect class="box" x="392" y="288" width="218" height="82" rx="14"/><text class="h" x="501" y="319" text-anchor="middle">Render both PDFs</text><text class="sub" x="501" y="344" text-anchor="middle">reading + interpretation</text>
  <polygon class="gate" points="266,280 364,329 266,378 168,329"/><text class="h" x="266" y="322" text-anchor="middle">Both QA?</text><text class="sub" x="266" y="344" text-anchor="middle">two reports pass</text>
  <rect class="ok" x="48" y="290" width="92" height="78" rx="14"/><text class="h" x="94" y="322" text-anchor="middle">Deliver</text><text class="sub" x="94" y="344" text-anchor="middle">complete</text>
  <path class="line" d="M1031 204V284"/><path class="line" d="M910 329H874"/><path class="line" d="M668 329H614"/><path class="line" d="M388 329H368"/><path class="line" d="M164 329H144"/>
  <text class="sub" x="893" y="320">yes</text><text class="sub" x="147" y="320">yes</text>

  <rect class="fail" x="424" y="470" width="232" height="76" rx="14"/><text class="h" x="540" y="501" text-anchor="middle">Preserve evidence + retry</text><text class="sub" x="540" y="524" text-anchor="middle">no silent partial success</text>
  <path class="dash" d="M540 216V466"/><text class="sub" x="551" y="242">no</text>
  <rect class="human" x="718" y="470" width="232" height="76" rx="14"/><text class="h" x="834" y="501" text-anchor="middle">Human revise / rerun</text><text class="sub" x="834" y="524" text-anchor="middle">reading or PDF correction</text>
  <path class="dash" d="M771 382V466"/><path class="dash" d="M266 382C266 438 680 438 718 493"/>
  <path class="line" d="M950 508C1120 508 1120 420 1031 374"/>

  <rect fill="#e2e8f0" x="48" y="608" width="1104" height="48" rx="12"/><text class="t" x="600" y="638" text-anchor="middle">Completion contract: source + approved window + reading QA + two PDFs + two PDF QA reports</text>
</svg>
