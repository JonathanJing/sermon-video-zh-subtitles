<text x="524" y="449" class="body" text-anchor="start">Same-message identity starts unknown</text>
<text x="524" y="475" class="body" text-anchor="start">Source hashes / dates / review status</text>
<text x="524" y="501" class="body" text-anchor="start">Atomic export; preserve prior pack</text>
