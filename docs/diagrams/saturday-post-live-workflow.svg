<text x="64" y="423" class="body" text-anchor="start">Separate same-message human approval</text>
<text x="64" y="449" class="body" text-anchor="start">Hash / expiry / review verification</text>
<text x="64" y="475" class="body" text-anchor="start">Fail down; A0 none remains available</text>
<text x="64" y="501" class="body" text-anchor="start">Machine Chinese never auto-approved</text>
